/* Slide canvas 1920x1080. All sizes scale with --k (auto-fit). */
.slide{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--bf),system-ui,sans-serif;font-size:calc(28px*var(--k));line-height:1.45;box-sizing:border-box}
.slide *{box-sizing:border-box}
.slide .sl-in{position:absolute;inset:104px 128px 120px 128px;display:flex;flex-direction:column}
.slide h1,.slide h2,.slide p,.slide blockquote,.slide figure,.slide ul{margin:0}
.slide .title{font-family:var(--hf),serif;font-weight:var(--hw);letter-spacing:var(--ls);text-transform:var(--tt);line-height:1.08;font-size:calc(66px*var(--k));text-wrap:balance}
.slide .sub{font-size:calc(30px*var(--k));color:var(--mu);margin-top:calc(18px*var(--k));max-width:1300px}
.slide .kicker{display:inline-block;font-size:calc(20px*var(--k));font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:calc(20px*var(--k))}
.slide .krule{width:72px;height:6px;background:var(--ac);margin-bottom:22px;border-radius:3px}
.slide:not(.dc-rule) .krule{display:none}
.slide .lead{font-size:calc(30px*var(--k));color:var(--tx);opacity:.86;max-width:1100px;margin-top:calc(28px*var(--k))}
.slide .head{flex:none;max-height:420px;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start}
.slide .num{font-family:var(--hf);font-weight:var(--hw);color:var(--ac);font-size:calc(30px*var(--k));line-height:1}
.slide .it-t{font-family:var(--hf);font-weight:var(--hw);font-size:calc(32px*var(--k));line-height:1.18;letter-spacing:var(--ls)}
.slide .it-x{font-size:calc(24px*var(--k));color:var(--mu);margin-top:calc(10px*var(--k));line-height:1.42}
.slide .card{background:var(--sf);border-radius:var(--r);padding:calc(36px*var(--k))}
.slide .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ac);flex:none;margin-top:.5em}
.slide .fit{overflow:hidden;min-height:0}
.slide .col{overflow:hidden;min-height:0}

/* photos */
.slide .ph{position:relative;overflow:hidden;border-radius:var(--r);background:var(--sf)}
.slide .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.slide .ph-empty{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 35%,var(--sf)),color-mix(in srgb,var(--a2) 30%,var(--sf)))}
.slide .credit{position:absolute;right:14px;bottom:10px;font-size:13px;line-height:1.2;color:#fff;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.8);max-width:80%;text-align:right;font-family:system-ui,sans-serif}
.pt-bw .ph img{filter:grayscale(1) contrast(1.08)}
.pt-warm .ph img{filter:sepia(.22) saturate(1.05) contrast(1.03)}
.pt-duotone .ph img{filter:grayscale(1) contrast(1.15) brightness(.85)}
.pt-duotone .ph::after{content:"";position:absolute;inset:0;background:var(--ac);mix-blend-mode:color;opacity:.75}
.pt-rounded .ph{border-radius:calc(var(--r) + 12px)}
.slide .side-ph{flex:0 0 40%;align-self:stretch}

/* deco */
.slide .dc{position:absolute;pointer-events:none}
.slide .blob{border-radius:50%;background:var(--ac);opacity:.10}
.slide .b1{width:720px;height:720px;right:-260px;top:-300px}
.slide .b2{width:420px;height:420px;left:-180px;bottom:-220px;background:var(--a2);opacity:.12}
.slide .bar-l{left:0;top:0;bottom:0;width:18px;background:var(--ac)}
.slide .gridbg{inset:0;background-image:radial-gradient(var(--mu) 1.4px,transparent 1.4px);background-size:48px 48px;opacity:.22}
.slide .frame{inset:36px;border:1.5px solid var(--ac);opacity:.7}
.slide .corner{right:0;top:0;width:260px;height:180px;background:var(--ac);opacity:.14;border-bottom-left-radius:120px}
.slide .stripe{left:0;right:0;top:0;height:14px;background:var(--ac)}
.slide .bignum{right:80px;bottom:30px;font-family:var(--hf);font-weight:800;font-size:360px;line-height:1;color:var(--tx);opacity:.05;letter-spacing:-.05em}
.dc-box .card,.dc-box .ph{border:5px solid var(--tx);box-shadow:12px 12px 0 var(--tx);border-radius:0}
.dc-box .title{background:var(--ac);color:#0A0A0A;padding:0 .18em;display:inline;box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.22}
.dc-box .head .title{display:inline}

/* footer */
.slide .foot{position:absolute;left:128px;right:128px;bottom:44px;display:flex;gap:40px;align-items:baseline;font-size:18px;color:var(--mu);line-height:1.2}
.slide .f-l{flex:none;max-width:560px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide .f-s{flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide .f-n{flex:none;font-variant-numeric:tabular-nums}

/* cover + end */
.slide .cover{position:absolute;inset:-104px -128px -120px -128px}
.slide .cover .title{font-size:calc(112px*var(--k));line-height:1.02}
.slide .cover .sub{font-size:calc(36px*var(--k))}
.slide .cover .meta{margin-top:calc(40px*var(--k));font-size:22px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
.slide .cover-ph{position:absolute;border-radius:0}
.slide .cover-txt{position:absolute;display:flex;flex-direction:column;overflow:hidden}
.slide .cover-txt::before,.slide .cover-txt::after{content:"";flex:1 1 0}
.cv-full .cover-txt::after,.cv-type:has(.cover-ph) .cover-txt::after{flex:0 0 0}
.cv-full .cover-ph{inset:0}
.cv-full .cover-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(0,0,0,.78) 100%)}
.cv-full .cover-txt{left:128px;right:300px;bottom:112px;top:120px}
.cv-full .cover-txt .title,.cv-full .cover-txt .sub{color:#fff}
.cv-full .cover-txt .sub{opacity:.88}
.cv-full .cover-txt .meta{color:rgba(255,255,255,.75)}
.cv-split .cover-ph{right:0;top:0;bottom:0;width:46%}
.pt-rounded .cv-split .cover-ph{top:56px;bottom:56px;right:56px;width:43%;border-radius:calc(var(--r) + 20px)}
.cv-split .cover-txt{left:128px;width:44%;top:120px;bottom:120px}
.cv-type .cover-txt{left:128px;right:128px;top:120px;bottom:120px}
.cv-type .cover-ph{right:128px;bottom:120px;width:520px;height:360px;border-radius:var(--r)}
.cv-type:has(.cover-ph) .cover-txt{right:740px}
.st-swiss .cv-type .title,.st-brutal .cv-type .title{font-size:calc(140px*var(--k))}
.cover.end .title{font-size:calc(96px*var(--k))}

/* agenda */
.g-agenda{display:flex;gap:96px;height:100%}
.g-agenda .head{flex:0 0 520px}
.ag-list{flex:1;display:flex;flex-direction:column;justify-content:center;gap:calc(26px*var(--k))}
.ag-row{display:grid;grid-template-columns:96px 1fr;column-gap:24px;padding-bottom:calc(22px*var(--k));border-bottom:1.5px solid color-mix(in srgb,var(--mu) 30%,transparent)}
.ag-row .it-x{grid-column:2;margin-top:6px}

/* section */

/* statement */
.g-statement{height:100%;display:flex;gap:88px;align-items:stretch}
.g-statement .st-txt{flex:1;display:flex;flex-direction:column;justify-content:center}
.g-statement .title.big{font-size:calc(92px*var(--k));line-height:1.05}
.g-statement.has-ph .title.big{font-size:calc(76px*var(--k))}

/* bullets */
.g-bullets{height:100%;display:flex;gap:72px}
.g-bullets .col{flex:1;display:flex;flex-direction:column}
.g-bullets .grid{flex:1;margin-top:calc(44px*var(--k));display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-content:start}
.g-bullets.n4 .grid,.g-bullets.n2 .grid{grid-template-columns:repeat(2,1fr)}
.g-bullets.n5 .grid{grid-template-columns:repeat(3,1fr)}
.g-bullets.has-ph .grid{grid-template-columns:1fr;gap:18px}
.g-bullets.has-ph .item{display:grid;grid-template-columns:64px 1fr;padding:calc(24px*var(--k)) calc(30px*var(--k))}
.g-bullets.has-ph .item .it-x{grid-column:2}
.g-bullets .item .num{margin-bottom:18px}
.g-bullets.has-ph .item .num{margin:4px 0 0}
.g-bullets.has-ph .side-ph{flex-basis:38%}

/* two-col */
.g-two{height:100%;display:flex;gap:88px}
.g-two .col{flex:1;display:flex;flex-direction:column;justify-content:center}
.g-two .side-ph{flex-basis:46%}
.g-two .pts{list-style:none;padding:0;margin-top:calc(36px*var(--k));display:flex;flex-direction:column;gap:calc(22px*var(--k))}
.g-two .pts li{display:grid;grid-template-columns:28px 1fr;column-gap:12px}
.g-two .pts .it-x{grid-column:2;margin-top:4px}
.g-two .pts .it-t{font-size:calc(28px*var(--k))}

/* quote */
.g-quote{height:100%;display:flex;gap:96px;align-items:center}
.g-quote .q-ph{flex:0 0 520px;height:640px}
.g-quote .q-txt{flex:1;max-height:100%}
.g-quote .qmark{font-family:var(--hf);font-size:260px;line-height:.7;color:var(--ac);height:140px}
.g-quote .q{font-family:var(--hf);font-weight:var(--hw);font-size:calc(58px*var(--k));line-height:1.2;letter-spacing:var(--ls)}
.g-quote .q-a{margin-top:calc(44px*var(--k));font-weight:700;font-size:calc(28px*var(--k))}
.g-quote .q-r{color:var(--mu);font-size:calc(24px*var(--k))}

/* big number */
.g-big{height:100%;display:flex;gap:96px}
.g-big .col{flex:1;display:flex;flex-direction:column;justify-content:center}
.g-big .bn{font-family:var(--hf);font-weight:var(--hw);color:var(--ac);line-height:.95;letter-spacing:-.03em;margin-bottom:calc(30px*var(--k))}
.g-big .bn-v{font-size:calc(260px*var(--k))}
.g-big .bn-u{font-size:calc(80px*var(--k));margin-left:18px}
.g-big .title{font-size:calc(54px*var(--k));max-width:1300px}
.g-big.has-ph .bn-v{font-size:calc(200px*var(--k))}

/* kpi */
.g-kpi{height:100%;display:flex;flex-direction:column}
.kpis{flex:1;margin-top:calc(56px*var(--k));display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-content:center}
.kpis.n4{grid-template-columns:repeat(4,1fr)}
.kpis.n2{grid-template-columns:repeat(2,1fr)}
.kp-v{font-family:var(--hf);font-weight:var(--hw);font-size:calc(84px*var(--k));color:var(--ac);line-height:1;margin-bottom:calc(22px*var(--k));letter-spacing:-.02em}
.kpis.n4 .kp-v{font-size:calc(68px*var(--k))}

/* timeline */
.g-time{height:100%;display:flex;flex-direction:column}
.tl{position:relative;flex:1;display:flex;gap:36px;align-items:flex-start;padding-top:calc(120px*var(--k))}
.tl-line{position:absolute;left:0;right:0;top:calc(128px*var(--k));height:3px;background:color-mix(in srgb,var(--mu) 40%,transparent)}
.tl-pt{position:relative;flex:1;padding-top:44px;min-width:0}
.tl-dot{position:absolute;top:0;left:0;width:20px;height:20px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 8px var(--bg)}
.tl-v{font-family:var(--hf);font-weight:var(--hw);font-size:calc(40px*var(--k));color:var(--ac);margin-bottom:12px;line-height:1.1}
.tl .it-t{font-size:calc(28px*var(--k))}
.tl .it-x{font-size:calc(22px*var(--k))}

/* process */

/* comparison */
.g-cmp{height:100%;display:flex;flex-direction:column}
.cmp{flex:1;margin-top:calc(48px*var(--k));display:flex;gap:32px}
.cmp .cm{flex:1;min-width:0}
.cmp .cm.first{box-shadow:inset 0 6px 0 var(--ac)}
.dc-box .cmp .cm.first{box-shadow:12px 12px 0 var(--tx);background:var(--ac)}
.cm-t{font-family:var(--hf);font-weight:var(--hw);font-size:calc(38px*var(--k));margin-bottom:calc(24px*var(--k));letter-spacing:var(--ls)}
.cmp ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:calc(16px*var(--k))}
.cmp li{display:grid;grid-template-columns:28px 1fr;column-gap:10px}
.cmp li .it-x{margin:0;color:var(--tx);opacity:.85}

/* chart */
.g-chart{height:100%;display:flex;flex-direction:column}
.ch-body{flex:1;display:flex;gap:72px;margin-top:calc(40px*var(--k));align-items:center}
.ch{flex:1.7;height:100%;min-width:0}
.chart{width:100%;height:100%}
.chart .bar{fill:var(--mu);opacity:.45}
.chart .bar.hi{fill:var(--ac);opacity:1}
.chart .axis{stroke:var(--mu);stroke-width:2;opacity:.5}
.chart .val{font-family:var(--hf);font-weight:700;font-size:30px;fill:var(--tx);text-anchor:middle}
.chart .lab{font-size:20px;fill:var(--mu);text-anchor:middle;font-family:var(--bf)}
.ch-side{flex:1}
.insight{font-size:calc(32px*var(--k));line-height:1.4;border-left:6px solid var(--ac);padding-left:32px}

/* gallery */
.g-gal{height:100%;display:flex;flex-direction:column}
.gal{flex:1;margin-top:calc(44px*var(--k));display:grid;grid-template-columns:repeat(3,1fr);gap:28px;min-height:0}
.gal.n2{grid-template-columns:repeat(2,1fr)}
.gal.n1{grid-template-columns:1fr}
.gal figure{display:flex;flex-direction:column;min-height:0}
.gal .gal-ph{flex:1}
.gal figcaption{margin-top:14px}

/* summary */
.g-sum{height:100%;display:flex;gap:88px}
.g-sum .col{flex:1;display:flex;flex-direction:column}
.sum-list{flex:1;margin-top:calc(44px*var(--k));display:flex;flex-direction:column;gap:calc(26px*var(--k))}
.sum-row{display:grid;grid-template-columns:90px 1fr;align-items:start;padding-bottom:calc(22px*var(--k));border-bottom:1.5px solid color-mix(in srgb,var(--mu) 30%,transparent)}
.sum-row .num{font-size:calc(44px*var(--k))}
.g-sum .side-ph{flex-basis:36%}
.g-time .tl{flex:none;margin:auto 0}
.dc-box .dot,.dc-box .tl-dot{background:var(--tx)}
.cmp{align-items:flex-start}
.cmp li .it-x{font-size:calc(27px*var(--k))}
.ag-row .it-t{font-size:calc(34px*var(--k))}
/* v2 layouts and decor, loaded after slides.css */
.slide .lay{flex:1;min-height:0;overflow:hidden}
.slide .lay>div{height:100%}
.slide .tagpill{position:absolute;top:56px;right:128px;z-index:2;background:var(--ac);color:var(--on-ac);font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:8px 20px;border-radius:999px;line-height:1.2}
.slide .take{flex:none;margin-top:calc(26px*var(--k));background:var(--ac);color:var(--on-ac);border-radius:var(--r);padding:calc(22px*var(--k)) 36px;font-size:calc(25px*var(--k));font-weight:600;line-height:1.35;display:flex;align-items:center;gap:20px}
.slide .take::before{content:"";flex:none;width:8px;align-self:stretch;border-radius:4px;background:var(--a2)}
.slide .ic{flex:none;width:calc(76px*var(--k));height:calc(76px*var(--k));border-radius:calc(var(--r) + 6px);background:color-mix(in srgb,var(--ac) 13%,transparent);color:var(--ac);display:grid;place-items:center}
.slide .ic svg{width:55%;height:55%;stroke-width:1.8}
.dc-box .ic{background:var(--ac);color:#0A0A0A;border:4px solid var(--tx);border-radius:0}
.slide .head .title{font-size:calc(56px*var(--k))}
.dc-topo .head .sub,.dc-topo .cover:not(.cv-full) .sub{font-style:italic;color:var(--ac)}
.dc-topo .head .sub{font-size:calc(24px*var(--k));margin-top:10px}
.slide .topo{inset:0;background:var(--ac);opacity:.09;-webkit-mask-size:cover;mask-size:cover}
.pt-framed .ph{border:12px solid #fff;box-shadow:0 14px 34px rgba(0,0,0,.18);border-radius:2px}
.pt-framed .cover .cover-ph{border:0;box-shadow:none}
.slide .card{box-shadow:0 2px 10px rgba(0,0,0,.05)}
.dc-topo .card{box-shadow:0 2px 0 color-mix(in srgb,var(--ac) 20%,transparent),0 6px 18px rgba(0,0,0,.06)}

/* section: coloured panel with big number + framed photo */
.g-section{display:flex;align-items:center;gap:96px}
.g-section .sec-bg{position:absolute;inset:-104px -128px -120px -128px;background:var(--ac)}
.g-section .sec-txt{position:relative;flex:1}
.g-section .sec-num{font-family:var(--hf);font-weight:var(--hw);font-size:240px;line-height:.9;color:var(--a2);letter-spacing:-.04em;margin-bottom:28px}
.g-section .title{font-size:calc(84px*var(--k));color:var(--on-ac)}
.g-section .sub{color:var(--on-ac);opacity:.8;font-style:italic}
.g-section .sec-ph{position:relative;flex:0 0 40%;height:86%}
.dc-box .g-section .sec-num{color:var(--tx)}
.dc-box .g-section .title{background:none;color:#0A0A0A}

/* cards with icons */
.g-cards{display:flex;flex-direction:column}
.cgrid{flex:1;margin-top:calc(40px*var(--k));display:grid;grid-template-columns:repeat(3,1fr);gap:26px;align-content:stretch;max-height:640px}
.cgrid .it-x{font-size:calc(26px*var(--k))}
.cgrid.n4,.cgrid.n2{grid-template-columns:repeat(2,1fr)}
.cd{display:flex;gap:26px;align-items:flex-start}
.cd .it-t{font-size:calc(34px*var(--k))}
.cd{padding:calc(40px*var(--k)) 36px}

/* focus: accent panel + icon list */
.g-focus{display:flex;flex-direction:column}
.fc{flex:1;margin-top:calc(36px*var(--k));display:flex;gap:32px}
.fc-panel{flex:0 0 34%;background:var(--ac);color:var(--on-ac);border-radius:var(--r);padding:56px 48px;display:flex;flex-direction:column;justify-content:center}
.fc-panel .kicker{color:var(--on-ac);opacity:.75}
.fc-label{font-family:var(--hf);font-weight:var(--hw);font-size:calc(96px*var(--k));line-height:1;letter-spacing:-.02em;margin-bottom:24px}
.fc-x{font-size:calc(26px*var(--k));opacity:.9;font-style:italic}
.fc-list{flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center}
.fc-list .card{padding:calc(32px*var(--k)) 36px}
.fc-list .it-x{font-size:calc(25px*var(--k))}

/* facts: KPI row + photo + info box */
.g-facts{display:flex;flex-direction:column}
.fx{flex:1;margin-top:calc(34px*var(--k));display:flex;flex-direction:column;gap:26px}
.fx .kpis{flex:none;margin:0;align-content:start}
.fx .kp{padding:calc(28px*var(--k)) 32px}
.fx .kp-v{font-size:calc(60px*var(--k));margin-bottom:10px}
.fx-row{flex:1;min-height:0;display:flex;gap:26px}
.fx-ph{flex:0 0 38%}
.fx-box{flex:1;overflow:hidden}
.fx-box .cm-t{color:var(--ac)}
.slide .pts{list-style:none;padding:0;margin-top:calc(18px*var(--k));display:flex;flex-direction:column;gap:calc(12px*var(--k))}
.slide .pts li{display:grid;grid-template-columns:26px 1fr;column-gap:10px}
.fx-box .pts .it-x{margin:0;color:var(--tx);font-size:calc(26px*var(--k))}
.fx-box{padding:calc(36px*var(--k)) 40px}
.fx .kp .it-x{font-size:calc(22px*var(--k))}

/* table */
.g-table{display:flex;flex-direction:column}
.tbl{flex:1;margin-top:calc(36px*var(--k))}
.tbl table{width:100%;border-collapse:separate;border-spacing:0;background:var(--sf);border-radius:var(--r);overflow:hidden;font-size:calc(27px*var(--k));line-height:1.35}
.tbl th{background:var(--ac);color:var(--on-ac);text-align:left;font-weight:700;padding:calc(22px*var(--k)) 30px;font-size:calc(25px*var(--k))}
.tbl td{padding:calc(22px*var(--k)) 30px;border-top:1px solid color-mix(in srgb,var(--mu) 22%,transparent);vertical-align:top}
.tbl td:first-child{font-weight:700}
.tbl tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--ac) 4%,transparent)}
.tbl tr.hl td{background:color-mix(in srgb,var(--a2) 18%,transparent)}

/* process: chevrons + cards */
.g-proc{display:flex;flex-direction:column}
.pr{flex:1;margin-top:calc(44px*var(--k));display:flex;flex-direction:column;justify-content:center;gap:22px}
.chev,.chev-c{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.cv{background:var(--ac);color:var(--on-ac);min-height:calc(96px*var(--k));padding:0 48px 0 52px;display:flex;align-items:center;gap:12px;clip-path:polygon(0 0,calc(100% - 34px) 0,100% 50%,calc(100% - 34px) 100%,0 100%,34px 50%);font-weight:700;font-size:calc(25px*var(--k));line-height:1.2}
.cv:first-child{clip-path:polygon(0 0,calc(100% - 34px) 0,100% 50%,calc(100% - 34px) 100%,0 100%);padding-left:30px}
.cv.alt{background:var(--a2);color:var(--on-a2)}
.cv-n{opacity:.8}
.chev-c .card{padding:calc(32px*var(--k)) 32px}
.chev-c .it-x{font-size:calc(26px*var(--k))}
.cv{font-size:calc(28px*var(--k))!important}
.chev-c .it-x{margin:0;color:var(--tx);opacity:.85}

/* timeline cards */
.tl-c{padding:calc(22px*var(--k)) 24px;margin-top:6px}
.tl-c .it-x{font-size:calc(21px*var(--k))}

/* comparison headers */
.cmp .cm{padding:0;overflow:hidden}
.cmp .cm .cm-t{margin:0;padding:calc(22px*var(--k)) 32px;background:var(--ac);color:var(--on-ac);font-size:calc(30px*var(--k))}
.cmp .cm.c1 .cm-t{background:var(--a2);color:var(--on-a2)}
.cmp .cm.c2 .cm-t{background:var(--tx);color:var(--bg)}
.cmp .cm ul{padding:calc(26px*var(--k)) 32px}

/* chart side + donut */
.ch{padding:28px}
.ch-side{display:flex;flex-direction:column;gap:22px}
.ch-side .kp{padding:28px 32px}
.ch-side .kp-v{font-size:calc(58px*var(--k));margin-bottom:8px}
.chart .seg.s0{fill:var(--ac);stroke:var(--ac)}
.chart .seg.s1{fill:var(--a2);stroke:var(--a2)}
.chart .seg.s2{fill:var(--mu);stroke:var(--mu)}
.chart .seg.s3{fill:var(--tx);stroke:var(--tx)}
.chart circle.seg{fill:none}
.chart .lg{font-size:26px;fill:var(--tx);font-family:var(--bf)}

/* sources */
.g-src{display:flex;flex-direction:column}
.src{flex:1;margin-top:calc(36px*var(--k));padding-left:36px;columns:2;column-gap:64px;font-size:calc(24px*var(--k))}
.src li{margin-bottom:14px;break-inside:avoid;color:var(--mu)}
.src .it-x{font-size:inherit;margin:0;word-break:break-word}

/* academic cover (university title page) */
.cover.academic{display:flex;flex-direction:column;padding:72px 128px 80px;background:var(--bg)}
.ac-org{text-align:center;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1.5;color:var(--ac);white-space:pre-line}
.ac-mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.ac-mid .title{font-size:calc(80px*var(--k));max-width:1500px}
.ac-mid .sub{margin-left:auto;margin-right:auto}
.ac-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:48px}
.ac-ph{width:440px;height:260px}
.ac-auth{text-align:right;font-size:24px;line-height:1.6;white-space:pre-line;color:var(--tx)}
.cover.academic .meta{text-align:center;margin-top:24px}

.g-section .sec-txt,.g-section .sec-ph{position:relative}
.ch-side .it-x{font-size:calc(22px*var(--k))}
.slide .lay>.cover{height:auto}
/* v3: denser, larger, three-colour slides and four style families (academic / bold / soft / editorial) */
.slide{--a3:color-mix(in srgb,var(--ac) 58%,#ffffff)}
.fam-bold,.fam-editorial.st-luxury{--a3:color-mix(in srgb,var(--a2) 55%,var(--ac))}

/* larger type everywhere: the samples read from the back row */
.slide .head .title{font-size:calc(62px*var(--k))}
.slide .it-t{font-size:calc(34px*var(--k))}
.slide .it-x{font-size:calc(27px*var(--k));line-height:1.4}
.slide .lead{font-size:calc(31px*var(--k))}
.slide .tagpill{top:136px;font-size:17px;padding:9px 26px}
.slide .head{padding-right:240px}

/* fill the slide: grids stretch to the bottom instead of floating in the middle */
.cgrid{max-height:none;align-content:stretch;grid-auto-rows:1fr}
.cgrid .cd{flex-direction:column;gap:20px}
.cgrid.n3 .cd,.cgrid.n2 .cd{padding:calc(48px*var(--k)) 44px}
.g-bullets .grid{align-content:stretch;grid-auto-rows:1fr}
.g-bullets.has-ph .grid{grid-auto-rows:auto;align-content:start}
.kpis{align-content:stretch}
.g-kpi .kpis{grid-auto-rows:1fr;max-height:520px}
.g-proc .pr{justify-content:flex-start;margin-top:calc(48px*var(--k))}
.g-proc .chev-c{flex:1}
.g-proc .steps,.g-proc .pr{min-height:0}
.chev-c .card{height:100%}
.cmp{align-items:stretch}
.g-time .tl{flex:1;margin:0;align-items:stretch;padding-top:calc(80px*var(--k))}
.tl-line{top:calc(88px*var(--k))}
.tl-pt{display:flex;flex-direction:column}
.tl-c{flex:1}
.fc-list{justify-content:stretch}
.fc-list .card{flex:1;display:flex;align-items:center}
.fc-list .card>div:last-child{flex:1}
.tbl td{font-size:calc(26px*var(--k))}

/* three colours in rotation: icons, KPI numbers, chevrons */
.slide .ic{border-radius:50%;background:var(--ac);color:var(--on-ac);width:calc(84px*var(--k));height:calc(84px*var(--k))}
.slide .ic svg{stroke-width:2}
.slide :nth-child(3n+2)>.ic{background:var(--a2);color:var(--on-a2)}
.slide :nth-child(3n+3)>.ic{background:var(--a3);color:#fff}
.slide .kp:nth-child(3n+2) .kp-v{color:var(--a2)}
.slide .kp:nth-child(3n+3) .kp-v{color:var(--a3)}
.slide .kp:nth-child(3n+1) .kp-v{color:var(--tx)}
.cv:nth-child(3n+3){background:var(--a3);color:#fff}
.slide .ag-row:nth-child(3n+2) .num,.slide .sum-row:nth-child(3n+2) .num{background:var(--a2);color:var(--on-a2)}
.slide .ag-row .num,.slide .sum-row .num{display:grid;place-items:center;width:calc(62px*var(--k));height:calc(62px*var(--k));border-radius:50%;background:var(--ac);color:var(--on-ac);font-size:calc(26px*var(--k))}
.slide .ag-row:nth-child(3n+3) .num,.slide .sum-row:nth-child(3n+3) .num{background:var(--a3);color:#fff}
.g-bullets .item .num{display:grid;place-items:center;width:calc(64px*var(--k));height:calc(64px*var(--k));border-radius:50%;background:var(--ac);color:var(--on-ac);font-size:calc(26px*var(--k))}
.g-bullets .item:nth-child(3n+2) .num{background:var(--a2);color:var(--on-a2)}
.g-bullets .item:nth-child(3n+3) .num{background:var(--a3);color:#fff}

/* chips row: "Legal basis: [Art. 92] [Art. 94]" */
.slide .chips{flex:none;margin-top:calc(22px*var(--k));display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:color-mix(in srgb,var(--ac) 9%,transparent);border-radius:var(--r);padding:calc(18px*var(--k)) 28px}
.slide .chips b{font-family:var(--hf);font-size:calc(26px*var(--k));margin-right:8px}
.slide .chips .chip{background:var(--ac);color:var(--on-ac);border-radius:999px;padding:8px 26px;font-size:calc(21px*var(--k));font-weight:700}

/* photo caption strip like a magazine (credit sits on a dark band) */
.slide .ph .credit{left:0;right:0;bottom:0;max-width:none;text-align:left;padding:10px 18px;font-size:15px;font-style:italic;background:linear-gradient(0deg,rgba(0,0,0,.62),rgba(0,0,0,0));text-shadow:none;opacity:1}

/* ---------- family: academic (white cards, shadows, filled icons, dark takeaway) ---------- */
.fam-academic .card{border-radius:4px;box-shadow:0 2px 3px rgba(0,0,0,.05),0 10px 26px rgba(0,0,0,.07)}
.fam-academic .take{background:var(--ac);border-radius:4px}
.fam-academic .blob{opacity:.16}
.fam-academic .b1{background:var(--a3);width:560px;height:560px;right:-200px;top:-240px}
.fam-academic .b2{background:var(--a2);opacity:.12}

/* ---------- family: bold (coloured blocks, big numbers, high contrast) ---------- */
.fam-bold .card{background:var(--sf);border-radius:var(--r);box-shadow:none;border:2px solid color-mix(in srgb,var(--tx) 10%,transparent)}
.fam-bold .cgrid .cd:nth-child(1),.fam-bold .fc-list .card:nth-child(1),.fam-bold .kp:nth-child(1){background:var(--ac);color:var(--on-ac);border-color:transparent}
.fam-bold .cgrid .cd:nth-child(1) .it-x,.fam-bold .fc-list .card:nth-child(1) .it-x,.fam-bold .kp:nth-child(1) .it-x,.fam-bold .kp:nth-child(1) .it-t{color:var(--on-ac);opacity:.85}
.fam-bold .kp:nth-child(1) .kp-v{color:var(--on-ac)}
.fam-bold .cgrid .cd:nth-child(1) .ic,.fam-bold .fc-list .card:nth-child(1) .ic{background:var(--on-ac);color:var(--ac)}
.fam-bold .head .title{font-size:calc(70px*var(--k));line-height:1.02}
.fam-bold .kp-v{font-size:calc(96px*var(--k))}
.fam-bold .take{background:var(--a2);color:var(--on-a2)}
.fam-bold .take::before{background:var(--on-a2)}

/* ---------- family: soft (rounded, tinted, no shadows) ---------- */
.fam-soft .card{background:color-mix(in srgb,var(--ac) 8%,var(--sf));box-shadow:none;border-radius:calc(var(--r) + 6px)}
.fam-soft .cgrid .cd:nth-child(3n+2),.fam-soft .fc-list .card:nth-child(3n+2),.fam-soft .kp:nth-child(3n+2){background:color-mix(in srgb,var(--a2) 12%,var(--sf))}
.fam-soft .take{background:color-mix(in srgb,var(--ac) 14%,var(--sf));color:var(--tx);border-radius:999px;padding-left:44px}
.fam-soft .take::before{background:var(--ac)}
.fam-soft .tagpill{background:color-mix(in srgb,var(--a2) 22%,var(--sf));color:var(--tx)}
.fam-soft .tbl table{border-radius:calc(var(--r) + 6px)}

/* ---------- family: editorial (no boxes, rules and white space) ---------- */
.fam-editorial .card{background:transparent;box-shadow:none;border-radius:0;border-top:3px solid var(--tx);padding-left:0;padding-right:12px}
.fam-editorial .cgrid .cd:nth-child(3n+2),.fam-editorial .kp:nth-child(3n+2){border-top-color:var(--ac)}
.fam-editorial .ic{background:none!important;color:var(--ac)!important;width:auto;height:auto;justify-content:start}
.fam-editorial .ic svg{width:calc(56px*var(--k));height:calc(56px*var(--k));stroke-width:1.5}
.fam-editorial .take{background:none;color:var(--tx);border-top:2px solid var(--tx);border-radius:0;padding:calc(20px*var(--k)) 0 0;font-family:var(--hf);font-size:calc(30px*var(--k));font-style:italic}
.fam-editorial .take::before{display:none}
.fam-editorial .tagpill{background:none;color:var(--ac);border:2px solid var(--ac)}
.fam-editorial .kp-v{font-size:calc(100px*var(--k))}
.fam-editorial .chev-c .card{border-top:0;border-left:3px solid var(--ac);padding:0 0 0 24px}
.fam-editorial .cmp .cm{border-top:0}
.fam-editorial .fc-panel{background:none;color:var(--tx);border:3px solid var(--tx);border-radius:0}
.fam-editorial .fc-panel .kicker{color:var(--ac)}
.fam-editorial .tbl table{background:none}
.fam-editorial .tbl th{background:none;color:var(--tx);border-bottom:3px solid var(--tx)}

/* v3b: header row (subtitle left, tag right), darker larger body text, icon beside card title */
.slide .head{padding-right:0;align-items:stretch}
.slide .hrow{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:calc(12px*var(--k))}
.slide .hrow .sub{margin-top:0}
.slide .hrow:empty{display:none}
.slide .hrow .tagpill{position:static;flex:none;margin-left:auto}
.slide .tagpill.abs{top:56px}
.slide .it-x{color:var(--tx);opacity:.82;font-size:calc(29px*var(--k))}
.slide .sl-in{inset:96px 104px 112px 104px}
.slide .foot{left:104px;right:104px}
.cgrid .cd{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;column-gap:22px;row-gap:18px;align-items:center;align-content:start}
.cgrid .cd .it-x{grid-column:1 / -1;margin:0}
.cgrid .cd .it-t{margin:0}
.slide .cd:nth-child(3n+2) .it-t{color:var(--a2)}
.slide .cd:nth-child(3n+3) .it-t{color:color-mix(in srgb,var(--a3) 70%,var(--tx))}
.fam-bold .cd:nth-child(1) .it-t{color:var(--on-ac)}
.slide .topo{opacity:.16}
.slide .bgp{inset:0;background-size:cover;background-position:center}
.cgrid .cd{grid-template-rows:auto auto}

/* ---------- family: glass (translucent cards over glowing backdrops) ---------- */
.fam-glass .card{background:rgba(255,255,255,.075);border:1.5px solid rgba(255,255,255,.2);box-shadow:0 10px 30px rgba(0,0,0,.25);border-radius:calc(var(--r) + 4px)}
.fam-glass .cgrid .cd:nth-child(3n+2),.fam-glass .kp:nth-child(3n+2){border-color:color-mix(in srgb,var(--a2) 55%,transparent)}
.fam-glass .cgrid .cd:nth-child(3n+3),.fam-glass .kp:nth-child(3n+3){border-color:color-mix(in srgb,var(--a3) 55%,transparent)}
.fam-glass .take{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.22);color:var(--tx)}
.fam-glass .take::before{background:var(--a2)}
.fam-glass .tagpill{background:rgba(255,255,255,.14);color:var(--tx);border:1px solid rgba(255,255,255,.3)}
.fam-glass .tbl table{background:rgba(255,255,255,.06)}
.fam-glass .tbl th{background:color-mix(in srgb,var(--ac) 70%,transparent)}
.fam-glass .fc-panel{background:linear-gradient(135deg,var(--ac),var(--a3));color:#0D1230}
.fam-glass .g-section .sec-bg{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 80%,#000),color-mix(in srgb,var(--a3) 60%,#000))}
/* v4: slide skeletons. Styles used to differ only by colour; now each style has its own composition
   (where the title sits, what frames the page, how the footer looks). Class sk-<name> on .slide, set by styles.json "skel". */

/* ---- band: full-width coloured header strip ---- */
.sk-band::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:var(--ac)}
.sk-band .head{min-height:196px}
.sk-band .head .title,.sk-band .head .sub,.sk-band .head .kicker{color:var(--on-ac)}
.sk-band .head .sub{opacity:.85;font-style:normal}
.sk-band .head .kicker{opacity:.8}
.sk-band .hrow .tagpill{background:var(--a2);color:var(--on-a2)}
.sk-band .tagpill.abs{background:var(--a2);color:var(--on-a2)}

/* ---- rail: coloured column on the left holds the title; rail-r on the right; rail-plain without colour ---- */
.sk-rail::before,.sk-rail-r::before,.sk-rail-plain::before{content:"";position:absolute;top:0;bottom:0;width:470px}
.sk-rail::before{left:0;background:var(--ac)}
.sk-rail-r::before{right:0;background:var(--ac)}
.sk-rail-plain::before{left:0;width:470px;border-right:2px solid color-mix(in srgb,var(--tx) 25%,transparent)}
.sk-rail .head,.sk-rail-plain .head{position:absolute;left:-48px;top:0;width:380px;max-height:none;padding:0}
.sk-rail-r .head{position:absolute;right:-48px;top:0;width:380px;max-height:none;padding:0}
.sk-rail .lay,.sk-rail-plain .lay{padding-left:422px}
.sk-rail-r .lay{padding-right:422px}
.sk-rail .take,.sk-rail-plain .take,.sk-rail .chips,.sk-rail-plain .chips{margin-left:422px}
.sk-rail-r .take,.sk-rail-r .chips{margin-right:422px}
.sk-rail .foot,.sk-rail-plain .foot{left:526px}
.sk-rail-r .foot{right:526px}
.sk-rail .head .title,.sk-rail-plain .head .title,.sk-rail-r .head .title{font-size:calc(46px*var(--k));line-height:1.1}
.sk-rail .head .title,.sk-rail .head .sub,.sk-rail .head .kicker,.sk-rail-r .head .title,.sk-rail-r .head .sub,.sk-rail-r .head .kicker{color:var(--on-ac)}
.sk-rail .head .sub,.sk-rail-r .head .sub{opacity:.85;font-style:normal}
.sk-rail .head .hrow,.sk-rail-plain .head .hrow,.sk-rail-r .head .hrow{flex-direction:column;align-items:flex-start;gap:16px}
.sk-rail .hrow .tagpill,.sk-rail-r .hrow .tagpill{background:var(--a2);color:var(--on-a2);margin-left:0}
.sk-rail-plain .hrow .tagpill{margin-left:0}
.sk-rail .tagpill.abs,.sk-rail-plain .tagpill.abs,.sk-rail-r .tagpill.abs{display:none}
.sk-rail .cgrid,.sk-rail-r .cgrid,.sk-rail-plain .cgrid{grid-template-columns:repeat(2,1fr)}
.sk-rail .kpis,.sk-rail-r .kpis,.sk-rail-plain .kpis{grid-template-columns:repeat(2,1fr)}

/* ---- index: a huge slide number stands left of the title (Swiss poster) ---- */
.sk-index::after{content:attr(data-n);position:absolute;left:96px;top:56px;font-family:var(--hf);font-weight:800;font-size:230px;line-height:1;letter-spacing:-.07em;color:var(--ac);z-index:0}
.sk-index .bignum{display:none}
.sk-index .head{padding-left:360px;min-height:190px;border-bottom:4px solid var(--tx);padding-bottom:26px}
.sk-index .head .title{font-size:calc(58px*var(--k));letter-spacing:-.04em}
.sk-index .tagpill.abs{display:none}

/* ---- masthead: newspaper title block, double rule ---- */
.sk-masthead .head,.sk-gold .head{align-items:center;text-align:center}
.sk-masthead .head{border-top:7px double var(--tx);border-bottom:2px solid var(--tx);padding:22px 0 20px}
.sk-masthead .head .title{font-size:calc(60px*var(--k))}
.sk-masthead .hrow,.sk-gold .hrow{justify-content:center}
.sk-masthead .hrow .tagpill,.sk-gold .hrow .tagpill{margin-left:18px}
.sk-masthead .tagpill.abs,.sk-gold .tagpill.abs{display:none}
.sk-masthead .foot{border-top:2px solid var(--tx);padding-top:10px}
.sk-masthead .card{border-top:0;border-left:2px solid var(--tx);padding-left:22px}
.sk-masthead .lay{column-rule:none}
.sk-gold .head{padding-bottom:26px;position:relative}
.sk-gold .head::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--ac),transparent)}
.sk-gold .head .title{font-weight:600;letter-spacing:.02em}

/* ---- frame: museum page with a double border and an ornament under the title ---- */
.sk-frame::before{content:"";position:absolute;inset:30px;border:3px double var(--ac);pointer-events:none;z-index:3}
.sk-frame .head{align-items:center;text-align:center}
.sk-frame .head::after{content:"❦";display:block;color:var(--ac);font-size:30px;margin:10px auto 0}
.sk-frame .hrow{justify-content:center}
.sk-frame .tagpill.abs{display:none}

/* ---- window: terminal window chrome with a prompt before the title ---- */
.sk-window::before{content:"";position:absolute;left:0;right:0;top:0;height:62px;background:var(--sf);border-bottom:1px solid color-mix(in srgb,var(--tx) 18%,transparent)}
.sk-window::after{content:"";position:absolute;left:30px;top:22px;width:18px;height:18px;border-radius:50%;background:#FF5F56;box-shadow:32px 0 #FFBD2E,64px 0 #27C93F}
.sk-window .head .title::before{content:"> ";color:var(--ac)}
.sk-window .head .sub::before{content:"# ";color:var(--mu)}
.sk-window .tagpill.abs{top:14px;right:30px;background:none;border:1px solid var(--ac);color:var(--ac);padding:5px 16px;font-size:14px}
.sk-window .foot{font-family:var(--hf)}

/* ---- letterbox: black cinema bars, centred caps title ---- */
.sk-letterbox::before,.sk-letterbox::after{content:"";position:absolute;left:0;right:0;height:62px;background:#000;z-index:3}
.sk-letterbox::before{top:0}
.sk-letterbox::after{bottom:0}
.sk-letterbox .head{align-items:center;text-align:center}
.sk-letterbox .hrow{justify-content:center}
.sk-letterbox .tagpill.abs{display:none}
.sk-letterbox .foot{z-index:4;bottom:18px}

/* ---- sticker: a tilted label with a hard shadow ---- */
.sk-sticker .head .title{display:inline-block;background:var(--a3);color:var(--tx);padding:10px 26px 14px;transform:rotate(-1.4deg);box-shadow:8px 8px 0 var(--tx);border:4px solid var(--tx);border-radius:6px}
.sk-sticker .head .sub{margin-top:22px;font-weight:700;color:var(--tx)}
.sk-sticker .hrow .tagpill{transform:rotate(2deg);border:3px solid var(--tx);background:var(--a2);color:var(--tx)}

/* ---- boxed: thick bordered title box with an offset block ---- */
.sk-boxed .head{border:6px solid var(--tx);padding:22px 34px;background:var(--sf);box-shadow:14px 14px 0 var(--tx)}
.sk-boxed .head .title{background:none!important;color:var(--tx)!important;padding:0!important}
.sk-boxed .tagpill.abs{display:none}

/* ---- bubble: the title lives in a soft rounded cloud ---- */
.sk-bubble .head{background:color-mix(in srgb,var(--ac) 14%,var(--sf));border-radius:56px;padding:30px 52px;align-items:center;text-align:center}
.sk-bubble .hrow{justify-content:center}
.sk-bubble .tagpill.abs{display:none}

/* ---- titleblock: engineering drawing, border frame and a title block at the bottom right ---- */
.sk-titleblock::before{content:"";position:absolute;inset:26px;border:2px solid rgba(255,255,255,.65);pointer-events:none;z-index:3}
.sk-titleblock .head{border-left:6px solid var(--a2);padding-left:26px}
.sk-titleblock .foot{left:auto;right:104px;bottom:44px;width:820px;border:2px solid rgba(255,255,255,.65);padding:10px 20px;background:var(--bg)}
.sk-titleblock .tagpill.abs{border-radius:0;background:none;border:2px solid var(--ac);color:var(--ac)}

/* ---- band-soft: a tinted curved header ---- */
.sk-bandsoft::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:color-mix(in srgb,var(--ac) 20%,var(--bg));border-radius:0 0 140px 140px / 0 0 90px 90px}
.sk-bandsoft .head{min-height:196px}

/* covers and sections follow the skeleton too */
.sk-letterbox .cover,.sk-window .cover{z-index:1}

.cap-bg [data-x=t]{color:transparent!important;-webkit-text-fill-color:transparent!important;text-shadow:none!important}

:root{--bg:#F5F4F0;--panel:#FFFFFF;--ink:#16161D;--soft:#6B6B78;--line:#E6E4DE;--ac:#5B57E0;--ac2:#E0679B;--ok:#1E9E6A;--sh:0 1px 2px rgba(20,20,40,.05),0 8px 28px rgba(20,20,40,.07);--sh2:0 2px 6px rgba(20,20,40,.08),0 24px 60px rgba(20,20,40,.16);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:40px;padding:14px 40px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.top.scrolled{border-color:var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px;letter-spacing:-.01em}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:15px;font-weight:800;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 35%,transparent)}
.tabs{display:flex;gap:6px;background:#ECEAE4;padding:4px;border-radius:14px}
.tabs a{padding:8px 16px;border-radius:10px;font-weight:600;font-size:14px;color:var(--soft);transition:all .25s var(--ease)}
.tabs a.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.count{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--ac);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px}
.count:empty{display:none}
main{min-height:calc(100vh - 70px)}
.banner{margin:12px 40px 0;padding:14px 18px;border-radius:14px;background:#FFF1E8;color:#8A3B12;font-size:14px;line-height:1.5}
.page{max-width:1480px;margin:0 auto;padding:28px 40px 80px;animation:pageIn .45s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero h1{font-size:44px;line-height:1.08;letter-spacing:-.03em;margin:18px 0 10px;font-weight:800;max-width:900px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--soft);font-size:17px;margin:0 0 30px;max-width:760px;line-height:1.55}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.chip{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--soft);cursor:pointer;transition:all .2s var(--ease)}
.chip:hover{color:var(--ink);border-color:#cfcdc6}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* scaled slide box */
.sbox{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:12px;background:#ddd;isolation:isolate}
.sbox>.slide{position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(var(--s,.2))}
.sbox .fadeL{position:absolute;inset:0;transition:opacity .6s var(--ease)}

/* style cards */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:26px}
.acard{background:var(--panel);border-radius:20px;padding:12px 12px 18px;box-shadow:var(--sh);cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s var(--ease);animation:cardIn .6s var(--ease) both;outline:none}
.acard:hover,.acard:focus-visible{transform:translateY(-6px);box-shadow:var(--sh2)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.acard .ameta{padding:14px 8px 0}
.acard .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.acard h3{margin:0;font-size:18px;letter-spacing:-.01em}
.atag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);background:#F0EEE8;padding:4px 9px;border-radius:7px;white-space:nowrap}
.acard p{margin:8px 0 12px;color:var(--soft);font-size:13.5px;line-height:1.5;min-height:60px}
.pal{display:flex;gap:6px;align-items:center}
.pal i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.pal span{margin-left:auto;font-size:12px;color:var(--soft)}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:5px;opacity:0;transition:opacity .3s;z-index:3}
.acard:hover .dots{opacity:1}
.dots b{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.2);transition:all .3s}
.dots b.on{background:#fff;width:16px;border-radius:3px}

/* create screen */
.create{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(380px,1fr);gap:40px;align-items:start}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--soft);font-weight:600;font-size:14px;cursor:pointer;margin-bottom:18px;border:0;background:none;padding:0;transition:color .2s}
.back:hover{color:var(--ink)}
.stage{background:var(--panel);border-radius:24px;padding:16px;box-shadow:var(--sh)}
.stage .sbox{border-radius:14px}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.thumbs .sbox{border-radius:8px;cursor:pointer;opacity:.55;transition:opacity .25s,transform .25s var(--ease);outline:2px solid transparent;outline-offset:2px}
.thumbs .sbox.on{opacity:1;outline-color:var(--ac)}
.thumbs .sbox:hover{opacity:1;transform:translateY(-2px)}
.form{background:var(--panel);border-radius:24px;padding:30px;box-shadow:var(--sh);position:sticky;top:90px}
.form h2{margin:0 0 6px;font-size:28px;letter-spacing:-.02em}
.form .lead{margin:0 0 24px;color:var(--soft);font-size:14.5px;line-height:1.55}
.f{display:block;margin-bottom:20px}
.f>span{display:block;font-weight:700;font-size:13px;margin-bottom:8px}
.f small{font-weight:500;color:var(--soft)}
.in{width:100%;border:1.5px solid var(--line);background:#FBFAF8;border-radius:14px;padding:13px 15px;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s;resize:vertical}
.in:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 14%,transparent)}
.range{display:flex;align-items:center;gap:16px}
.range input{flex:1;accent-color:var(--ac)}
.range b{font-size:28px;min-width:46px;text-align:right;letter-spacing:-.02em}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg button{border:1px dashed #cfcdc6;background:none;border-radius:999px;padding:5px 11px;font-size:12px;color:var(--soft);cursor:pointer;transition:all .2s}
.sugg button:hover{border-style:solid;color:var(--ac);border-color:var(--ac)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;padding:14px 22px;font-weight:700;font-size:15px;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s,background .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.main{width:100%;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 60%,var(--ac2)));color:#fff;box-shadow:0 10px 24px color-mix(in srgb,var(--ac) 30%,transparent);padding:17px}
.btn.main:hover{box-shadow:0 14px 32px color-mix(in srgb,var(--ac) 42%,transparent);transform:translateY(-1px)}
.btn.ghost{background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px #c9c6be}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#2c2c36}
.btn[disabled]{opacity:.5;pointer-events:none}
.hint{font-size:12.5px;color:var(--soft);margin:14px 0 0;line-height:1.5;text-align:center}

/* progress overlay */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(22,22,29,.38);backdrop-filter:blur(10px);animation:fadeIn .3s both}
@keyframes fadeIn{from{opacity:0}}
.ov .box{width:min(520px,92vw);background:var(--panel);border-radius:26px;padding:36px;box-shadow:var(--sh2);animation:pop .45s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
.ov h3{margin:0 0 4px;font-size:22px}
.ov .sub{color:var(--soft);font-size:14px;margin-bottom:26px}
.osteps{display:flex;flex-direction:column;gap:14px}
.ostep{display:flex;align-items:center;gap:14px;font-weight:600;color:#A4A2AC;transition:color .3s}
.ostep i{width:30px;height:30px;border-radius:50%;border:2px solid #E2E0DA;display:grid;place-items:center;font-style:normal;font-size:14px;flex:none;transition:all .3s}
.ostep.on{color:var(--ink)}
.ostep.on i{border-color:var(--ac);border-top-color:transparent;animation:spin .9s linear infinite}
.ostep.ok{color:var(--ink)}
.ostep.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.ov .now{margin-top:22px;font-size:13px;color:var(--soft);display:flex;justify-content:space-between}
.pbar{height:6px;border-radius:3px;background:#EEECE6;margin-top:10px;overflow:hidden}
.pbar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .8s var(--ease)}
.ov .err{color:#B42318;background:#FEF3F2;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;margin-top:18px;white-space:pre-wrap}

/* editor */
.ed{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;max-width:1720px;margin:0 auto;padding:20px 32px 60px;animation:pageIn .45s var(--ease) both}
.edbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.edbar .t{flex:1;min-width:240px}
.edbar .t input{width:100%;border:0;background:none;font-size:24px;font-weight:800;letter-spacing:-.02em;outline:none;padding:4px 0;border-bottom:2px solid transparent;transition:border-color .2s}
.edbar .t input:focus{border-color:var(--ac)}
.edbar .t small{color:var(--soft);font-size:13px}
.sel{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 12px;font-weight:600;font-size:14px;cursor:pointer}
.side{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 170px);overflow:auto;padding:4px 8px 4px 4px;position:sticky;top:86px}
.side .th{position:relative;cursor:pointer;transition:transform .2s var(--ease)}
.side .th .sbox{border-radius:8px;outline:2px solid transparent;outline-offset:2px;transition:outline-color .2s;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.side .th.on .sbox{outline-color:var(--ac)}
.side .th:hover{transform:translateX(2px)}
.side .th em{position:absolute;left:-2px;top:-6px;font-style:normal;font-size:11px;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px;z-index:2}
.mainv .sbox{border-radius:16px;box-shadow:var(--sh2)}
.mainv [data-k]{outline:none;border-radius:6px;transition:box-shadow .15s}
.mainv [data-k]:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 45%,transparent)}
.mainv [data-k]:focus{box-shadow:0 0 0 4px var(--ac)}
.below{display:grid;grid-template-columns:1fr auto;gap:16px;margin-top:18px;align-items:start}
.below textarea{min-height:84px}
.below .tools{display:flex;flex-direction:column;gap:8px}
.tip{font-size:12.5px;color:var(--soft);margin-top:8px}

/* library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.lib .acard p{min-height:0;margin:6px 0 0}
.lib .del{border:0;background:none;color:var(--soft);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:8px;transition:all .2s}
.lib .del:hover{background:#FEF3F2;color:#B42318}
.empty{text-align:center;padding:80px 20px;color:var(--soft)}
.empty h2{color:var(--ink);font-size:26px;margin:0 0 8px}

/* show mode */
.show{position:fixed;inset:0;z-index:60;background:#000;display:grid;place-items:center;cursor:none}
.show .sbox{width:min(100vw,177.78vh);border-radius:0;background:#000}
.show .sbox .slide{animation:slideIn .45s var(--ease) both}
@keyframes slideIn{from{opacity:0}}
.show .cnt{position:fixed;right:18px;bottom:12px;color:rgba(255,255,255,.4);font-size:13px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .35s var(--ease);z-index:90;box-shadow:var(--sh2)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1000px){.create{grid-template-columns:1fr}.form{position:static}.ed{grid-template-columns:1fr}.side{flex-direction:row;max-height:none;position:static;overflow-x:auto}.side .th{flex:0 0 160px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.hright{margin-left:auto;display:flex;align-items:center;gap:12px}
.langs{display:flex;background:#ECEAE4;padding:4px;border-radius:12px}
.langs button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--soft);cursor:pointer;transition:all .25s var(--ease)}
.langs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.gear{width:40px;height:40px;border-radius:12px;border:0;background:#ECEAE4;font-size:18px;cursor:pointer;transition:transform .4s var(--ease),background .2s}
.gear:hover{transform:rotate(60deg);background:#e2dfd7}
.seg{display:flex;gap:8px}
.seg label{flex:1;cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg b{display:block;text-align:center;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#FBFAF8;font-weight:700;transition:all .2s}
.seg input:checked+b{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,#fff);color:var(--ac)}
.tp summary{cursor:pointer;font-weight:700;font-size:13px;margin-bottom:10px}
.tp summary small{font-weight:500;color:var(--soft)}
.tp label{display:block;margin-top:10px}
.tp label>span{display:block;font-size:12.5px;font-weight:600;color:var(--soft);margin-bottom:6px}
.prov{display:flex;flex-direction:column;gap:8px}
.pv{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);opacity:.55;transition:all .2s}
.pv.on{opacity:1;border-color:color-mix(in srgb,var(--ac) 40%,var(--line))}
.pv label{cursor:pointer;display:flex;gap:8px;align-items:center}
.pv span button{border:0;background:#F0EEE8;border-radius:8px;width:32px;height:30px;margin-left:4px;cursor:pointer}
.pv span button[disabled]{opacity:.3}
.f.two>label>span{display:block;font-weight:700;font-size:13px;margin-bottom:8px}

.ov .stop{margin-top:18px;width:100%}
.below .tools{display:flex;flex-direction:column;gap:8px}
.below .tools .btn{padding:11px 14px;font-size:14px;justify-content:flex-start}
.trow{display:flex;gap:6px}
.trow .btn{flex:1;justify-content:center!important;padding:11px 8px!important}
.lsearch{max-width:420px;margin:0 0 22px}

.look{border:1.5px solid var(--line);border-radius:16px;padding:16px;background:#FBFAF8}
.lk-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.lk-top b{font-size:14px}
.lk-top span{font-size:12px;color:var(--soft);margin-right:auto}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.lk-lab{font-size:12px;font-weight:700;color:var(--soft);margin:12px 0 6px}
.lk-row{display:flex;flex-wrap:wrap;gap:6px}
.pal-b{display:flex;border:2px solid transparent;border-radius:10px;padding:3px;background:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1);transition:transform .15s}
.pal-b:hover{transform:translateY(-2px)}
.pal-b i{width:13px;height:22px}
.pal-b i:first-child{border-radius:6px 0 0 6px}.pal-b i:last-child{border-radius:0 6px 6px 0}
.pal-b.on,.bg-b.on{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
.bg-b{width:74px;height:44px;border-radius:9px;border:2px solid var(--line);background-size:cover;background-position:center;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s}
.bg-b:hover{transform:translateY(-2px)}

const SLIDES_CSS="/* Slide canvas 1920x1080. All sizes scale with --k (auto-fit). */\n.slide{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--bf),system-ui,sans-serif;font-size:calc(28px*var(--k));line-height:1.45;box-sizing:border-box}\n.slide *{box-sizing:border-box}\n.slide .sl-in{position:absolute;inset:104px 128px 120px 128px;display:flex;flex-direction:column}\n.slide h1,.slide h2,.slide p,.slide blockquote,.slide figure,.slide ul{margin:0}\n.slide .title{font-family:var(--hf),serif;font-weight:var(--hw);letter-spacing:var(--ls);text-transform:var(--tt);line-height:1.08;font-size:calc(66px*var(--k));text-wrap:balance}\n.slide .sub{font-size:calc(30px*var(--k));color:var(--mu);margin-top:calc(18px*var(--k));max-width:1300px}\n.slide .kicker{display:inline-block;font-size:calc(20px*var(--k));font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:calc(20px*var(--k))}\n.slide .krule{width:72px;height:6px;background:var(--ac);margin-bottom:22px;border-radius:3px}\n.slide:not(.dc-rule) .krule{display:none}\n.slide .lead{font-size:calc(30px*var(--k));color:var(--tx);opacity:.86;max-width:1100px;margin-top:calc(28px*var(--k))}\n.slide .head{flex:none;max-height:420px;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start}\n.slide .num{font-family:var(--hf);font-weight:var(--hw);color:var(--ac);font-size:calc(30px*var(--k));line-height:1}\n.slide .it-t{font-family:var(--hf);font-weight:var(--hw);font-size:calc(32px*var(--k));line-height:1.18;letter-spacing:var(--ls)}\n.slide .it-x{font-size:calc(24px*var(--k));color:var(--mu);margin-top:calc(10px*var(--k));line-height:1.42}\n.slide .card{background:var(--sf);border-radius:var(--r);padding:calc(36px*var(--k))}\n.slide .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ac);flex:none;margin-top:.5em}\n.slide .fit{overflow:hidden;min-height:0}\n.slide .col{overflow:hidden;min-height:0}\n\n/* photos */\n.slide .ph{position:relative;overflow:hidden;border-radius:var(--r);background:var(--sf)}\n.slide .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}\n.slide .ph-empty{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 35%,var(--sf)),color-mix(in srgb,var(--a2) 30%,var(--sf)))}\n.slide .credit{position:absolute;right:14px;bottom:10px;font-size:13px;line-height:1.2;color:#fff;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.8);max-width:80%;text-align:right;font-family:system-ui,sans-serif}\n.pt-bw .ph img{filter:grayscale(1) contrast(1.08)}\n.pt-warm .ph img{filter:sepia(.22) saturate(1.05) contrast(1.03)}\n.pt-duotone .ph img{filter:grayscale(1) contrast(1.15) brightness(.85)}\n.pt-duotone .ph::after{content:\"\";position:absolute;inset:0;background:var(--ac);mix-blend-mode:color;opacity:.75}\n.pt-rounded .ph{border-radius:calc(var(--r) + 12px)}\n.slide .side-ph{flex:0 0 40%;align-self:stretch}\n\n/* deco */\n.slide .dc{position:absolute;pointer-events:none}\n.slide .blob{border-radius:50%;background:var(--ac);opacity:.10}\n.slide .b1{width:720px;height:720px;right:-260px;top:-300px}\n.slide .b2{width:420px;height:420px;left:-180px;bottom:-220px;background:var(--a2);opacity:.12}\n.slide .bar-l{left:0;top:0;bottom:0;width:18px;background:var(--ac)}\n.slide .gridbg{inset:0;background-image:radial-gradient(var(--mu) 1.4px,transparent 1.4px);background-size:48px 48px;opacity:.22}\n.slide .frame{inset:36px;border:1.5px solid var(--ac);opacity:.7}\n.slide .corner{right:0;top:0;width:260px;height:180px;background:var(--ac);opacity:.14;border-bottom-left-radius:120px}\n.slide .stripe{left:0;right:0;top:0;height:14px;background:var(--ac)}\n.slide .bignum{right:80px;bottom:30px;font-family:var(--hf);font-weight:800;font-size:360px;line-height:1;color:var(--tx);opacity:.05;letter-spacing:-.05em}\n.dc-box .card,.dc-box .ph{border:5px solid var(--tx);box-shadow:12px 12px 0 var(--tx);border-radius:0}\

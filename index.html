const RULES = `Задача: презентация должна по-настоящему объяснять и раскрывать тему, как у сильного эксперта, а не у нейросети. Образец уровня — хорошая защита в вузе или доклад консультанта: каждый слайд плотный, конкретный и визуальный.
Правила текста:
- Конкретика: факты, даты, имена, места, законы и статьи, механизмы, причины и следствия, примеры из жизни. Каждый слайд добавляет новое знание, без повторов.
- Заголовок слайда — вывод или мысль (до 10 слов), а не тема. Плохо: «Преимущества». Хорошо: «Ветряки дешевле угля уже в 30 странах».
- subtitle у содержательных слайдов — короткий курсивный подзаголовок (3–7 слов), уточняет контекст.
- tag — метка слайда в 1–2 слова заглавными по смыслу (ФАКТЫ, ЗАКОН, СХЕМА, ПРИМЕР, ИСТОРИЯ, АНАЛИЗ, ВЫВОД и т. п.).
- takeaway — главный вывод слайда одной фразой до 20 слов. Ставь его у большинства содержательных слайдов.
- Не выдумывай контакты, e-mail, телефоны, сайты и ссылки.
- Запрещены штампы: «в современном мире», «играет ключевую роль», «важно отметить», «уникальный», «инновационный», «давайте рассмотрим», «таким образом», эмодзи, восклицательные знаки. Заголовки «Введение»/«Заключение» запрещены.
- Цифры только достоверные, с полем source (организация или документ и год). Если не уверен в точной цифре — не выдумывай, пиши качественно или «≈».
- Плотно и конкретно, как в хорошей курсовой или отчёте: на каждом содержательном слайде не меньше 3–4 проверяемых деталей — числа с единицами, даты, названия мест, организаций, документов и статей, имена, примеры из Казахстана, если тема о нём.
- В пунктах и box.points можно писать «Метка: значение» (например «Орталығы: Қарқаралы қаласы, 1824 ж.») — метка будет выделена жирным.
- Пиши как живой эксперт: без общих фраз, без пустых вводных, без «является важным», без пересказа заголовка. Каждое предложение несёт факт или вывод.
- Объём: text до 45 слов, text в пунктах 12–28 слов, title пункта 2–5 слов.
- История связная: вступление → суть → детали, данные и примеры → проблемы → решения → итог.
- Сначала продумай логику рассказа (идея из сильных презентаций): заголовки слайдов подряд должны читаться как цепочка доводов «тезис → доказательство → вывод», где каждый следующий слайд отвечает на вопрос предыдущего. Никаких слайдов «для объёма».
- Разнообразие: используй разные макеты, не ставь один макет два раза подряд. Почти каждый слайд несёт визуальный элемент: фото, иконки, цифры, таблицу, график или шаги.`;

const LAYOUT_SPEC = `Макеты (поле layout) и их поля:
- title: title, subtitle, text (короткая строка вроде «Лекция · 2026»). Всегда первый слайд.
- agenda: title, items[3–6]{title,text}.
- section: title, subtitle — разделитель главы (крупный номер на цветном фоне). Нужен фото imageQuery.
- statement: kicker, title (сильная мысль до 14 слов), text.
- bullets: kicker, title, subtitle, text (необязательно), items[3–5]{title,text}.
- cards: title, subtitle, items[4–6]{icon,title,text} — карточки с иконками.
- focus: title, subtitle, kicker, label (крупная метка: статья закона, год, термин, число — до 12 знаков), text (что это), items[3]{icon,title,text}.
- facts: title, subtitle, items[3–4]{value (напр. "23 400 км²"), title (что это)}, box{title, points[3–4] строки}, text (необязательно). Требует фото.
- table: title, subtitle, table{head[2–4] (названия столбцов), rows[3–7] (массивы строк, по одной ячейке на столбец), highlight (индекс важной строки или null)}, source.
- two-col: kicker, title, subtitle, text (абзац 30–45 слов), items[0–3]{title,text}. Требует фото.
- quote: quote (реальная цитата реального человека), author (имя), subtitle (кто он, год).
- big-number: kicker, number (только цифры, напр. "71"), unit (напр. "%"), title (что это значит), text, source.
- kpi: title, subtitle, items[3–4]{value, title, text}, source.
- timeline: title, subtitle, items[4–6]{value (год/дата), title, text}.
- process: title, subtitle, items[3–5]{title (2–3 слова), text} — шаги, этапы, порядок.
- comparison: title, subtitle, items[2–3]{title, points[3–4] (строки)}, text (вывод).
- chart: title (вывод из данных), subtitle, chart{type ("bar" или "donut" для долей), labels[2–8], values[числа], unit}, items[0–2]{value,title} — ключевые цифры рядом, text (объяснение 15–30 слов), source. Только реальные данные.
- gallery: title, images[3]{query, caption}.
- summary: title, items[3–4]{title,text} — главные выводы.
- sources: title, items[4–10]{title (книга, закон, сайт, организация и год)} — список источников.
- end: title (короткая финальная мысль или благодарность), subtitle.
chips — необязательная строка-плашки внизу слайда: {label (напр. «Правовая основа», «Ключевые термины»), items[2–4] (коротко: «ЖК 92-бап», «ст. 43»)}. Ставь у cards, focus, comparison, process, two-col, когда есть законы, статьи, термины или ключевые понятия.
icon — одно имя из списка: ${ICONS.join(', ')}.
Фото должны строго соответствовать теме. У каждого слайда с фото: imageQuery и imageMust — 1–2 английских слова, которые обязательно есть в описании нужного фото (конкретный объект, а не общее слово: «solar power plant», а не «solar»; место и объект, оба слова обязательны: "Karkaraly", "yurt", "Lake Balkhash"). На верхнем уровне JSON поле imageMust — главный объект всей темы на английском (место или предмет). Фото без этих слов не берётся.
Фото: реальные фотографии ищутся в Wikimedia Commons по полю imageQuery (на английском, 2–5 слов, конкретный предмет, место, событие или вид людей, который реально сфотографирован: "Lake Baikal ice winter", "wheat harvest Kazakhstan", "surgeon operating room"; не абстракции). Фото несут макеты title, section, statement, bullets, two-col, quote, big-number, facts, summary, end и gallery: не меньше 70% слайдов презентации должны быть этими макетами, и у каждого из них обязательно imageQuery и imageMust (у gallery вместо этого images[].query и must). Макеты без фото (agenda, cards, focus, table, chart, kpi, timeline, process, comparison, sources) — не больше 30% слайдов. Подряд не ставь больше двух макетов без фото.
У каждого слайда поле notes — 2–4 предложения, что сказать докладчику.`;

function intro({ topic, count, wishes, style, lang }) {
  return `Тема презентации: ${topic}
Число слайдов: ровно ${count}.
Стиль оформления: «${style.name}» (${style.tag}). ${style.desc}${style.upper ? ' Стиль крупный: заголовки до 6 слов.' : ''}
${LANG[lang] || LANG.ru}
${wishes ? 'Требования автора (выполни обязательно): ' + wishes : ''}`;
}
const ORDER = count => `Порядок: первый слайд title, последний end, предпоследний summary${count >= 16 ? ', перед ним sources' : ''}. ${count >= 12 ? `Второй слайд agenda (план). Раздели презентацию на ${Math.max(2, Math.min(6, Math.round(count / 8)))} главы слайдами section.` : ''} Используй не меньше ${Math.min(10, Math.max(6, Math.round(count / 2)))} разных макетов.`;

function buildPrompt(o) {
  return `Сделай презентацию.\n${intro(o)}\n\n${RULES}\n\n${LAYOUT_SPEC}\n${ORDER(o.count)}\n\nВерни только JSON:\n{"title":"...","subtitle":"...","imageTopic":"общий запрос на английском для фото по теме","imageMust":"главный объект темы на английском","slides":[{"layout":"title",...}, ...]}`;
}
function outlinePrompt(o) {
  return `Составь подробный план презентации.\n${intro(o)}\n\n${RULES}\n\n${LAYOUT_SPEC}\n${ORDER(o.count)}\n\nСейчас нужен только план: для каждого из ${o.count} слайдов layout, title (окончательный заголовок на языке презентации) и brief (1–2 предложения на русском: что именно на слайде, какие факты, цифры, примеры). Не повторяй темы между слайдами.\nВерни только JSON:\n{"title":"...","subtitle":"...","imageTopic":"...","imageMust":"главный объект темы на английском","slides":[{"layout":"...","title":"...","brief":"..."}, ...]}`;
}
function chunkPrompt(o, outline, from, to) {
  return `Пишем презентацию по готовому плану.\n${intro(o)}\n\n${RULES}\n\n${LAYOUT_SPEC}\n\nПлан всей презентации:\n${JSON.stringify(outline.slides.map((s, i) => ({ n: i + 1, layout: s.layout, title: s.title, brief: s.brief })))}\n\nЗаполни полностью слайды с номерами ${from + 1}–${to + 1} (всего ${to - from}) строго по их плану: тот же layout и заголовок, все поля макета, конкретные факты из brief. Остальные слайды не пиши.\nВерни только JSON: {"slides":[...]} — ровно ${to - from} объектов по порядку.`;
}

function parseJSON(s) {
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('В ответе нет JSON');
  return JSON.parse(s.slice(a, b + 1));
}

const NEEDS_ITEMS = ['bullets', 'agenda', 'kpi', 'timeline', 'process', 'summary', 'comparison', 'cards', 'focus', 'facts', 'sources'];
function normSlide(s) {
  const str = v => (v === undefined || v === null) ? undefined : String(v).trim() || undefined;
  const o = { layout: LAYOUTS.includes(s.layout) ? s.layout : 'bullets' };
  for (const k of ['kicker', 'title', 'subtitle', 'text', 'quote', 'author', 'number', 'unit', 'source', 'notes', 'imageQuery', 'imageMust', 'tag', 'takeaway', 'label']) if (str(s[k])) o[k] = str(s[k]);
  if (Array.isArray(s.items)) o.items = s.items.slice(0, LIMITS[o.layout] || 5).map(it => typeof it === 'string' ? { title: it } :
    { title: str(it.title)?.replace(/^\s*\d{1,2}\s*[.)]\s*/, ''), text: str(it.text), value: str(it.value), icon: ICONS.includes(it.icon) ? it.icon : undefined, points: Array.isArray(it.points) ? it.points.slice(0, 5).map(String) : undefined });
  if (s.chips && Array.isArray(s.chips.items) && s.chips.items.length) o.chips = { label: str(s.chips.label), items: s.chips.items.slice(0, 5).map(String) };
  if (s.box) o.box = { title: str(s.box.title), points: Array.isArray(s.box.points) ? s.box.points.slice(0, 5).map(String) : [] };
  if (s.table && Array.isArray(s.table.rows) && s.table.rows.length) {
    const head = (s.table.head || []).slice(0, 5).map(String), w = head.length || (s.table.rows[0] || []).length;
    o.table = { head, rows: s.table.rows.slice(0, 8).map(r => (Array.isArray(r) ? r : [r]).slice(0, w).map(c => String(c ?? ''))), highlight: Number.isInteger(s.table.highlight) ? s.table.highlight : null };
  } else if (o.layout === 'table') o.layout = 'bullets';
  if (s.chart && Array.isArray(s.chart.values)) {
    const values = s.chart.values.map(v => parseFloat(String(v).replace(',', '.').replace(/[^\d.\-]/g, ''))).filter(v => !isNaN(v)).slice(0, 8);
    o.chart = { type: s.chart.type === 'donut' ? 'donut' : 'bar', labels: (s.chart.labels || []).slice(0, values.length).map(String), values, unit: str(s.chart.unit) };
    if (!values.length) { o.layout = 'bullets'; delete o.chart; }
  } else if (o.layout === 'chart') o.layout = 'statement';
  if (o.layout === 'gallery') o.images = (s.images || []).slice(0, 3).map(im => ({ query: str(im.query), must: str(im.must), caption: str(im.caption) }));
  if (NEEDS_ITEMS.includes(o.layout) && !(o.items || []).length) o.layout = 'statement';
  return o;
}

function normalize(raw, count) {
  const str = v => (v === undefined || v === null) ? undefined : String(v).trim() || undefined;
  const slides = (Array.isArray(raw.slides) ? raw.slides : []).map(normSlide).slice(0, count);
  if (!slides.length) throw new Error('Модель вернула пустую презентацию');
  return { title: str(raw.title) || slides[0].title || 'Презентация', subtitle: str(raw.subtitle), imageTopic: str(raw.imageTopic), imageMust: str(raw.imageMust), slides };
}

async function askJSON(prompt, job) {
  let last;
  for (let a = 0; a < 2; a++) {
    if (job?.cancelled) throw new Error(CANCELLED);
    const out = await runAI(prompt + (last ? `\n\nПрошлый ответ не разобрался как JSON (${last}). Верни строго валидный JSON.` : ''), job);
    try { return parseJSON(out); } catch (e) { last = e.message; }
  }
  throw new Error('Не удалось получить корректный ответ от Claude: ' + last);
}

// Kazakh editor: a second AI reads every text and fixes spelling, endings (vowel harmony), cases and calques,
// returning the same JSON; only strings in the same places are taken, so the structure can't be broken
const TEXT_KEYS = ['kicker', 'title', 'subtitle', 'text', 'quote', 'author', 'tag', 'takeaway', 'label', 'unit', 'notes'];
function textsOf(s) {
  const o = {};
  for (const k of TEXT_KEYS) if (typeof s[k] === 'string') o[k] = s[k];
  if (s.items) o.items = s.items.map(it => ({ title: it.title, text: it.text, value: it.value, points: it.points }));
  if (s.box) o.box = { title: s.box.title, points: s.box.points };
  if (s.chips) o.chips = { label: s.chips.label, items: s.chips.items };
  if (s.table) o.table = { head: s.table.head, rows: s.table.rows };
  if (s.chart) o.chart = { labels: s.chart.labels };
  if (s.images) o.images = s.images.map(im => ({ caption: im.caption }));
  return o;
}
const MERGE_KEYS = new Set([...TEXT_KEYS, 'items', 'value', 'points', 'box', 'chips', 'table', 'head', 'rows', 'chart', 'labels', 'images', 'caption']);
function mergeTexts(dst, src) { // copy corrected strings only where the original has a string in the same place
  if (!src || typeof src !== 'object') return;
  for (const k of Object.keys(src)) {
    if (!(k in dst) || !MERGE_KEYS.has(k)) continue;
    if (typeof dst[k] === 'string' && typeof src[k] === 'string' && src[k].trim()) dst[k] = src[k].trim();
    else if (Array.isArray(dst[k]) && Array.isArray(src[k])) dst[k].forEach((v, i) => { if (typeof v === 'string' && typeof src[k][i] === 'string' && src[k][i].trim()) dst[k][i] = src[k][i].trim(); else if (Array.isArray(v) && Array.isArray(src[k][i])) v.forEach((c, j) => { if (typeof c === 'string' && typeof src[k][i][j] === 'string' && src[k][i][j].trim()) v[j] = src[k][i][j].trim(); }); else if (v && typeof v === 'object') mergeTexts(v, src[k][i]); });
    else if (dst[k] && typeof dst[k] === 'object') mergeTexts(dst[k], src[k]);
  }
}
async function proofreadKk(deck, job) {
  const ranges = [];
  for (let a = 0; a < deck.slides.length; a += 8) ranges.push([a, Math.min(deck.slides.length, a + 8)]);
  const head = { title: deck.title, subtitle: deck.subtitle };
  await pool(ranges.map(([a, b], n) => async () => {
    const part = { ...(n ? {} : { deck: head }), slides: deck.slides.slice(a, b).map(textsOf) };
    try {
      const r = await askJSON(`Сен — қазақ тілінің тәжірибелі редакторы және корректорысың. Төмендегі JSON — презентация слайдтарының мәтіні.
Әр жолды қазақ әдеби тілінің нормасына сай тексеріп түзет:
- емле (ә, ғ, қ, ң, ө, ұ, ү, һ, і әріптері дұрыс тұруы), бас әріп, тыныс белгілері;
- үндестік заңы бойынша жалғаулар мен жұрнақтар, септік жалғаулары, тәуелдік, жіктік жалғаулары;
- сөйлем құрылымы (баяндауыш соңында), сөз тіркестерінің үйлесімі;
- орыс тілінен сөзбе-сөз аударылған тіркестерді табиғи қазақша баламаға ауыстыр; ресми терминологияны қолдан;
- мағынаны, деректерді, сандарды, атауларды, заң баптарын ӨЗГЕРТПЕ, жаңа мәлімет қоспа, мәтінді қысқартпа.
Тек мәтінді түзет. JSON құрылымы, кілттер, массив ұзындықтары дәл сол күйінде қалсын.
Тек JSON қайтар.

${JSON.stringify(part)}`, job);
      if (r.deck && n === 0) mergeTexts(head, r.deck);
      (r.slides || []).forEach((src, i) => { if (deck.slides[a + i]) mergeTexts(deck.slides[a + i], src); });
    } catch (e) { if (job?.cancelled) throw e; console.error('proofread:', e.message); } // the deck stays usable without the pass
    job.n = (job.n || 0) + 1;
  }), 4);
  deck.title = head.title; deck.subtitle = head.subtitle;
}

async function pool(tasks, n) {
  const res = []; let i = 0;
  await Promise.all([...Array(n)].map(async () => { while (i < tasks.length) { const k = i++; res[k] = await tasks[k](); } }));
  return res;
}


// iPhone app (home-screen web app): stands in for the claude.ai capabilities the phone page expects.
// Text: Google Gemini with the user's own free key (kept only on this phone). Photos: Wikimedia Commons, as on the laptop.
// Files: iOS share sheet ("Save to Files"), else a normal download.
(function () {
  const KEY = 'aep_gemini_key';
  const get = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
  const put = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch { } };
  const MODELS = ['gemini-3.8-flash', 'gemini-3.5-flash', 'gemini-flash-latest', 'gemini-3.5-flash-lite', 'gemini-flash-lite-latest']; // first that answers; 404 / 429 / 503 move on

  // several keys (one per line) are used in turn: a key out of quota or a busy model just moves on to the next
  const keyList = () => get(KEY).split(/[\s,;]+/).filter(k => k.length > 20);
  let rot = 0;
  async function gemini(prompt, opts = {}) {
    const keys = keyList();
    if (!keys.length) { setTimeout(keyDialog, 0); throw { code: 'no_key', message: 'no key' }; }
    let last, badKeys = 0;
    for (const m of MODELS) {
      for (let i = 0; i < Math.min(keys.length, 4); i++) {
        const key = keys[(rot + i) % keys.length];
        let r;
        try {
          r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, {
            method: 'POST', signal: opts.signal, headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
            body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json', temperature: 0.7 } })
          });
        } catch (e) { if (opts.signal?.aborted) throw { code: 'cancelled' }; last = { code: 'upstream_error', message: String(e) }; continue; }
        const j = await r.json().catch(() => ({}));
        if (r.ok) {
          const text = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
          if (text.trim()) { rot = (rot + i) % keys.length; return { text, truncated: j.candidates?.[0]?.finishReason === 'MAX_TOKENS' }; }
          last = { code: 'empty_completion', message: 'empty' }; continue;
        }
        if (r.status === 400 || r.status === 403) { last = { code: 'bad_key', message: j.error?.message || r.status }; if (/API key/i.test(last.message)) badKeys++; continue; }
        last = { code: r.status === 429 ? 'rate_limited' : 'upstream_error', message: j.error?.message || String(r.status) }; // 404 model gone, 429 quota, 503 busy
        if (r.status === 404) break;
      }
    }
    throw badKeys >= Math.min(keys.length, 4) ? { code: 'bad_key', message: 'bad key' } : last;
  }

  async function save({ filename, data }) {
    const type = filename.endsWith('.pdf') ? 'application/pdf' : 'application/vnd.openxmlformats-officedocument.presentationml.presentation';
    const file = new File([data], filename, { type });
    if (navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file], title: filename }); return { status: 'saved' }; }
      catch (e) { if (e.name === 'AbortError') throw { code: 'declined' }; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = filename;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    return { status: 'saved' };
  }

  window.claude = { use: async n => n === 'sample' ? gemini : n === 'downloads' ? { save } : null };

  // ---------- key dialog ----------
  function keyDialog() {
    if (document.querySelector('.ov.key')) return;
    const kk = (document.documentElement.lang || 'ru') === 'kk';
    const t = kk ? { h: 'Gemini кілттері', p: 'Мәтінді Google Gemini жазады. Кілттерді бірден бәрін қойыңыз (әрқайсысы жаңа жолдан немесе бос орынмен бөлініп) — олар сақталады және кезекпен қолданылады.', s: 'Сақтау және тексеру', c: 'Жабу', d: 'Барлығын өшіру', n: n => `Сақталған кілттер: ${n}`, ok: (g, n) => `Жарамды: ${g} / ${n}`, chk: 'Тексерілуде…', help: 'Тегін кілт: aistudio.google.com → Get API key' }
      : { h: 'Ключи Gemini', p: 'Текст пишет Google Gemini. Вставьте сразу все ключи (каждый с новой строки или через пробел): они сохранятся и будут использоваться по очереди.', s: 'Сохранить и проверить', c: 'Закрыть', d: 'Удалить все', n: n => `Сохранено ключей: ${n}`, ok: (g, n) => `Рабочих: ${g} из ${n}`, chk: 'Проверяю…', help: 'Бесплатный ключ: aistudio.google.com → Get API key' };
    const norm = txt => [...new Set(String(txt).split(/[\s,;]+/).map(x => x.replace(/^["'`]|["'`]$/g, '')).filter(x => x.length > 20))];
    const ov = document.createElement('div'); ov.className = 'ov key';
    const have = norm(get(KEY));
    ov.innerHTML = `<div class="box wide"><h3>${t.h}</h3><div class="sub">${t.p}</div><div class="keycount" id="gk-n">${t.n(have.length)}</div>
      <textarea class="in" id="gk" rows="6" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…&#10;AIza…&#10;AQ.Ab8…"></textarea>
      <div class="hint" style="text-align:left">${t.help}</div><div id="gk-r" class="keyres"></div>
      <div class="row2"><button class="btn ghost" id="gk-c">${t.c}</button><button class="btn dark" id="gk-s">${t.s}</button></div>${have.length ? `<button class="btn ghost" id="gk-d" style="margin-top:10px;width:100%">${t.d}</button>` : ''}</div>`;
    document.body.append(ov);
    const ta = ov.querySelector('#gk'), res = ov.querySelector('#gk-r');
    ov.querySelector('#gk-c').onclick = () => ov.remove();
    // saved keys are added to what is pasted (nothing is lost), duplicates dropped, dead keys removed after the check
    ov.querySelector('#gk-s').onclick = async () => {
      const all = norm(get(KEY) + '\n' + ta.value);
      if (!all.length) return;
      put(KEY, all.join('\n'));
      res.textContent = t.chk;
      const verdict = await Promise.all(all.map(k => fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1', { headers: { 'x-goog-api-key': k } }).then(r => r.ok ? 'ok' : (r.status === 400 || r.status === 403) ? 'bad' : 'ok', () => 'ok')));
      const good = all.filter((_, i) => verdict[i] === 'ok');
      if (good.length) put(KEY, good.join('\n'));
      res.textContent = t.ok(good.length, all.length);
      ov.querySelector('#gk-n').textContent = t.n(good.length); ta.value = '';
      if (good.length) setTimeout(() => ov.remove(), 1400);
    };
    const d = ov.querySelector('#gk-d'); if (d) d.onclick = () => { put(KEY, ''); ov.remove(); };
  }
  // first start: ask for the keys at once, not on the first failed generation
  window.addEventListener('load', () => setTimeout(() => { if (!get(KEY) && get('aep_name')) keyDialog(); }, 900)); // a new user gives the name first, then the keys
  window.AEP_KEY_DIALOG = keyDialog;

  // Android (Samsung Internet / Chrome): offer "install as an app" once the browser says it can
  let installEvt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); installEvt = e;
    if (document.querySelector('.installbar') || matchMedia('(display-mode: standalone)').matches) return;
    const kk = (document.documentElement.lang || 'ru') === 'kk';
    const bar = document.createElement('div'); bar.className = 'installbar';
    bar.innerHTML = `<span>${kk ? 'Қосымша ретінде орнату' : 'Установить как приложение'}</span><button id="inst-y">${kk ? 'Орнату' : 'Установить'}</button><button id="inst-n" aria-label="x">✕</button>`;
    document.body.append(bar);
    bar.querySelector('#inst-y').onclick = async () => { bar.remove(); installEvt.prompt(); };
    bar.querySelector('#inst-n').onclick = () => bar.remove();
  });
  window.addEventListener('appinstalled', () => document.querySelector('.installbar')?.remove());

  // ---------- photos from Wikimedia Commons (same rules as the laptop: only on-topic files) ----------
  const BAD = /\b(map|logo|flag|coat of arms|diagram|chart|graph|scheme|icon|seal|emblem|signature|document|page|screenshot|stamp|svg|plan|banner|poster|cover|satellite|relief|topographic|bathymetr\w*|landsat|sentinel|nasa|locator|location)\b/i;
  const strip = h => String(h || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
  const STOP = new Set('photo photograph image picture view views landscape people modern small large typical scene general area region district with from near and panorama traditional'.split(' '));
  const words = q => String(q || '').toLowerCase().split(/[^a-zа-яёәғқңөұүһі0-9]+/).filter(w => w.length >= 4 && !STOP.has(w));
  const stemHit = (text, ws) => ws.filter(w => text.includes(w.slice(0, Math.max(4, Math.min(6, w.length - 1))))).length;
  const wm = async params => { const r = await fetch('https://commons.wikimedia.org/w/api.php?' + new URLSearchParams({ format: 'json', origin: '*', ...params })); return r.json(); };
  const credit = ii => { const m = ii.extmetadata || {}; return `Фото: ${strip(m.Artist?.value).slice(0, 48) || 'автор неизвестен'} · ${strip(m.LicenseShortName?.value) || 'свободная лицензия'} · Wikimedia Commons`; };
  const okFile = (p, used) => { const ii = p.imageinfo?.[0]; if (!ii) return false; const ratio = ii.width / ii.height;
    return ii.mime === 'image/jpeg' && ii.width >= 1000 && ratio >= 0.65 && ratio <= 2.4 && !BAD.test(p.title) && !used.has(p.title); };
  const pick = (p, used) => { used.add(p.title); const ii = p.imageinfo[0]; return { src: ii.thumburl || ii.url, credit: credit(ii), page: ii.descriptionurl }; };

  // every file that passes the on-topic test, best first (the editor shows several to choose from)
  async function commonsAll(q, used, must) {
    const j = await wm({ action: 'query', generator: 'search', gsrsearch: q + ' filetype:bitmap', gsrnamespace: '6', gsrlimit: '40', prop: 'imageinfo|categories', cllimit: 'max',
      iiprop: 'url|size|mime|extmetadata', iiurlwidth: '1600', iiextmetadatafilter: 'Artist|LicenseShortName|ImageDescription' });
    const n = words(q).length, need = words(must);
    return Object.values(j.query?.pages || {}).filter(p => okFile(p, used)).map(p => {
      const own = (p.title + ' ' + strip(p.imageinfo[0].extmetadata?.ImageDescription?.value).slice(0, 160)).toLowerCase();
      return { p, mustHit: stemHit(own, need), ownHit: stemHit(own, words(q)) };
    }).filter(x => (!need.length || x.mustHit >= Math.min(2, need.length)) && x.ownHit >= Math.ceil(n / 2))
      .sort((a, b) => (b.mustHit - a.mustHit) || (b.ownHit - a.ownHit) || (a.p.index - b.p.index)).map(x => x.p);
  }
  window.AEP_PHOTO_OPTIONS = async (q, must, used, count = 6) => {
    const seen = new Set(used), out = [];
    for (const t of [q, ...(must ? [must] : [])]) {
      try { for (const p of await commonsAll(t, seen, must)) { if (out.length >= count) break; if (!out.some(o => o.page === p.imageinfo[0].descriptionurl)) out.push(pick(p, new Set())); } } catch { }
      if (out.length >= count) break;
    }
    return out;
  };

  async function commons(q, used, must) {
    const j = await wm({ action: 'query', generator: 'search', gsrsearch: q + ' filetype:bitmap', gsrnamespace: '6', gsrlimit: '30', prop: 'imageinfo|categories', cllimit: 'max',
      iiprop: 'url|size|mime|extmetadata', iiurlwidth: '1600', iiextmetadatafilter: 'Artist|LicenseShortName|ImageDescription' });
    const n = words(q).length, need = words(must);
    const best = Object.values(j.query?.pages || {}).filter(p => okFile(p, used)).map(p => {
      const own = (p.title + ' ' + strip(p.imageinfo[0].extmetadata?.ImageDescription?.value).slice(0, 160)).toLowerCase();
      return { p, mustHit: stemHit(own, need), ownHit: stemHit(own, words(q)) };
    }).filter(x => (!need.length || x.mustHit >= Math.min(2, need.length)) && x.ownHit >= Math.ceil(n / 2))
      .sort((a, b) => (b.mustHit - a.mustHit) || (b.ownHit - a.ownHit) || (a.p.index - b.p.index))[0];
    return best ? pick(best.p, used) : null;
  }
  async function wikiLead(subject, used) {
    for (const lang of ['en', 'ru', 'kk']) {
      try {
        const r = await fetch(`https://${lang}.wikipedia.org/w/api.php?` + new URLSearchParams({ action: 'query', format: 'json', origin: '*', generator: 'search', gsrsearch: subject, gsrlimit: '3', prop: 'pageimages', piprop: 'name' }));
        const pages = Object.values((await r.json()).query?.pages || {}).sort((a, b) => a.index - b.index).filter(p => p.pageimage && /\.jpe?g$/i.test(p.pageimage));
        if (!pages.length) continue;
        const j = await wm({ action: 'query', titles: pages.map(p => 'File:' + p.pageimage).join('|'), prop: 'imageinfo', iiprop: 'url|size|mime|extmetadata', iiurlwidth: '1600', iiextmetadatafilter: 'Artist|LicenseShortName|ImageDescription' });
        const ws = words(subject);
        const f = Object.values(j.query?.pages || {}).find(p => okFile(p, used) && stemHit((p.title + ' ' + strip(p.imageinfo[0].extmetadata?.ImageDescription?.value).slice(0, 160)).toLowerCase(), ws) >= Math.min(2, ws.length));
        if (f) return pick(f, used);
      } catch { }
    }
    return null;
  }
  async function findPhoto(q, must, used) {
    const m = must || '';
    const tries = [q, m && q && words(q).filter(w => !words(m).includes(w)).slice(0, 1).concat(words(m)).join(' '), m].filter((x, i, a) => x && a.indexOf(x) === i);
    for (const t of tries) { try { const f = await commons(t, used, m); if (f) return f; } catch { } }
    if (/^\p{Lu}/u.test(m)) return wikiLead(m, used);
    return null;
  }
  // Photos: candidates for every slide, then ONE text call where the AI "inspector" reads each candidate's file name and
  // description against the slide and picks the one that really shows the subject, or rejects them all (no photo beats a wrong one).
  window.AEP_PHOTOS = async (deck, job) => {
    const used = new Set(), tasks = [];
    deck.slides.forEach((s, i) => {
      if (s.imageQuery) tasks.push({ id: tasks.length, slide: s.title || deck.title, q: s.imageQuery, must: s.imageMust || deck.imageMust, set: v => s.image = v });
      (s.images || []).forEach(im => tasks.push({ id: tasks.length, slide: im.caption || s.title || deck.title, q: im.query, must: im.must || deck.imageMust, set: v => Object.assign(im, v) }));
    });
    job.total = tasks.length; job.n = 0;
    const queue = [...tasks];
    const worker = async () => {
      for (let t; !job.cancelled && (t = queue.shift());) {
        t.cands = [];
        try {
          const seen = new Set();
          for (const q of [t.q, t.must].filter(Boolean)) {
            for (const p of await commonsAll(q, seen, t.must)) if (t.cands.length < 5) { t.cands.push(p); seen.add(p.title); }
            if (t.cands.length >= 3) break;
          }
          if (!t.cands.length && /^\p{Lu}/u.test(t.must || '')) { const f = await wikiLead(t.must, new Set()); if (f) t.lead = f; }
        } catch { }
        job.n++;
      }
    };
    await Promise.all([worker(), worker()]);
    if (job.cancelled) return;
    // the inspector (one call for the whole deck)
    const withC = tasks.filter(t => t.cands.length > 1);
    let verdict = {};
    if (withC.length) {
      try {
        const payload = withC.map(t => ({ id: t.id, slide: t.slide, topic: deck.topic, want: t.q, candidates: t.cands.map((p, i) => ({ i, file: p.title.replace(/^File:/, '').slice(0, 90), about: strip(p.imageinfo[0].extmetadata?.ImageDescription?.value).slice(0, 140) })) }));
        const r = await gemini('You are a strict photo editor of a presentation. For every item choose the ONE candidate photo that really shows what the slide is about (judge by file name and description). If none clearly fits, answer -1: a missing photo is better than a wrong one. Never choose maps, logos, diagrams or unrelated subjects. Reply only JSON: [{"id":number,"pick":number}].\n\n' + JSON.stringify(payload));
        const arr = JSON.parse(r.text.slice(r.text.indexOf('['), r.text.lastIndexOf(']') + 1));
        for (const x of arr) verdict[x.id] = x.pick;
      } catch { /* no verdict: the strict ranking below decides */ }
    }
    for (const t of tasks) {
      let p = null;
      if (t.cands.length) { const k = t.id in verdict ? verdict[t.id] : 0; p = k >= 0 && t.cands[k] ? t.cands[k] : null; if (p && used.has(p.title)) p = t.cands.find(c => !used.has(c.title) && verdict[t.id] === undefined) || null; }
      if (p) { used.add(p.title); t.set(pick(p, new Set())); } else if (t.lead) t.set(t.lead);
    }
  };
  window.AEP_FIND_PHOTO = findPhoto;
})();

const NO_PHOTO = 'Фото не нужны: не пиши поля imageQuery, imageMust и images.';
async function runAI(prompt, job) {
  if (!cap.sample) throw new Error(T().noClaude);
  // photos are added by hand on the phone (the page cannot reach Wikimedia), so the photo rules are dropped
  if (!window.AEP_PHOTOS) prompt = prompt.replace(/Фото должны строго[\s\S]*?images\[\]\.query\./, NO_PHOTO);
  const ctl = new AbortController();
  (job.ctls ??= new Set()).add(ctl);
  try { return (await cap.sample(prompt, { signal: ctl.signal, cache: false })).text; }
  catch (e) { throw new Error(e.code === 'cancelled' ? CANCELLED : aiError(e)); }
  finally { job.ctls.delete(ctl); }
}
function aiError(e) {
  const L = T();
  return ({ no_key: L.errNoKey, bad_key: L.errBadKey, not_granted: L.errGrant, sampling_disabled: L.errGrant, rate_limited: L.errRate, session_expired: L.errSession })[e.code] || (L.errAI + (e.message ? ' (' + e.code + ')' : ''));
}

async function generateDeck(job, { topic, count, wishes, styleId, lang, org, author, theme }) {
  const style = styleOf(styleId);
  lang = lang === 'kk' ? 'kk' : 'ru';
  count = Math.max(5, Math.min(50, Number(count) || 10));
  const o = { topic, count, wishes, style, lang };
  job.step = 'text';
  let raw;
  if (count <= 14) raw = await askJSON(buildPrompt(o), job);
  else {
    job.sub = 'plan';
    const outline = await askJSON(outlinePrompt(o), job);
    outline.slides = (outline.slides || []).slice(0, count);
    const ranges = [];
    for (let a = 0; a < outline.slides.length; a += 8) ranges.push([a, Math.min(outline.slides.length, a + 8)]);
    job.sub = 'parts'; job.n = 0; job.total = ranges.length;
    const parts = await pool(ranges.map(([a, b]) => async () => {
      const r = await askJSON(chunkPrompt(o, outline, a, b), job);
      job.n++;
      const got = Array.isArray(r.slides) ? r.slides : [];
      return outline.slides.slice(a, b).map((plan, i) => ({ ...plan, ...(got[i] || {}), layout: plan.layout }));
    }), 2);
    raw = { ...outline, slides: parts.flat() };
  }
  if (job.cancelled) throw new Error(CANCELLED);
  const deck = { id: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), styleId: style.id, theme: { seed: (Math.random() * 1e9) | 0, ...(theme || {}) },
    lang, topic, wishes, createdAt: new Date().toISOString(), ...normalize(raw, count) };
  if (lang === 'kk') { job.step = 'proof'; job.sub = null; job.n = 0; await proofreadKk(deck, job); }
  const first = deck.slides[0];
  if (first && first.layout === 'title' && (org || author)) { if (org) first.org = String(org).trim(); if (author) first.author = String(author).trim(); }
  if (window.AEP_PHOTOS) { job.step = 'photos'; job.n = 0; await window.AEP_PHOTOS(deck, job); }
  for (const s of deck.slides) if (s.layout === 'gallery' && (s.images || []).filter(im => im.src).length < 2) { // no photos: the captions become a list
    s.layout = 'bullets'; s.items = (s.images || []).filter(im => im.caption).map(im => ({ title: im.caption })); delete s.images;
    if (!s.items.length) s.layout = 'statement';
  }
  if (job.cancelled) throw new Error(CANCELLED);
  job.step = 'layout';
  return deck;
}

function runGenerate(body) {
  const L = T();
  const steps = [['text', L.stText], ...(body.lang === 'kk' ? [['proof', L.stProof]] : []), ...(window.AEP_PHOTOS ? [['photos', L.stPhotos]] : []), ['layout', L.stLayout]];
  const ov = sheet(`<h3>${L.making}</h3><div class="sub">${esc(body.topic)} · ${body.count} ${L.slides}</div>
    <div class="osteps">${steps.map(([k, t], i) => `<div class="ostep" data-k="${k}"><i>${i + 1}</i>${t}</div>`).join('')}</div>
    <div class="pbar"><b></b></div><div class="now"><span id="msg">${L.starting}</span><span id="tm">0:00</span></div><div id="err"></div>
    <button class="btn ghost stop" id="stop">${L.cancel}</button>`);
  const job = {}, t0 = Date.now();
  const paint = () => {
    const idx = steps.findIndex(s => s[0] === job.step);
    ov.querySelectorAll('.ostep').forEach((el, i) => { el.classList.toggle('ok', i < idx); el.classList.toggle('on', i === idx); });
    const part = job.sub === 'parts' && job.total ? job.n / job.total : 0;
    $('.pbar b', ov).style.width = (job.step === 'photos' ? 86 + 10 * ((job.n || 0) / (job.total || 1)) : job.step === 'proof' ? 80 : job.step === 'layout' ? 96 : 6 + 70 * part + Math.min(12, (Date.now() - t0) / 8000)) + '%';
    $('#msg', ov).textContent = job.step === 'photos' ? L.photos(job.n || 0, job.total || 0) : job.step === 'proof' ? L.stProof : job.sub === 'plan' ? L.plan : job.sub === 'parts' ? L.parts(Math.min(job.total, (job.n || 0) + 1), job.total) : L.stText;
    const s = (Date.now() - t0) / 1000 | 0; $('#tm', ov).textContent = `${s / 60 | 0}:${String(s % 60).padStart(2, '0')}`;
  };
  const tick = setInterval(paint, 1000);
  $('#stop', ov).onclick = () => { job.cancelled = true; (job.ctls || []).forEach(c => c.abort()); clearInterval(tick); ov.remove(); toast(L.cancelled); };
  generateDeck(job, body).then(async deck => {
    clearInterval(tick);
    if (job.cancelled) return;
    try { await store.put(deck); } catch (e) { toast(L.saved + (e.message || e.code)); }
    ls.set('aep_draft', '{}');
    ov.remove(); editor(deck.id, deck);
  }).catch(e => {
    clearInterval(tick);
    if (job.cancelled) return;
    $('#stop', ov).remove();
    $('#err', ov).innerHTML = `<div class="err">${esc(e.message)}</div><div class="row2"><button class="btn ghost" id="cl">${L.close}</button><button class="btn dark" id="rt">${L.retry}</button></div>`;
    $('#cl', ov).onclick = () => ov.remove();
    $('#rt', ov).onclick = () => { ov.remove(); runGenerate(body); };
  });
}

// a phone photo: shrunk to 1600 px, kept in the artifact's asset store (else inline, smaller)
async function storePhoto(file) {
  const img = await createImageBitmap(file);
  const shrink = async (max, q) => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return new Promise(ok => c.toBlob(ok, 'image/jpeg', q)); };
  if (cap.assets) { try { const r = await cap.assets.upload(await shrink(1600, .85)); return r.url; } catch { } }
  const blob = await shrink(900, .72);
  return await new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(blob); });
}

function show(deck, st, start) {
  const sh = document.createElement('div'); sh.className = 'show';
  document.body.append(sh);
  let i = start, x0 = null;
  const draw = () => { sh.innerHTML = `<div class="cnt">${i + 1} / ${deck.slides.length}</div><button class="x" aria-label="close">✕</button>`; sh.prepend(slideBox(deck, i, st)); sh.querySelector('.x').onclick = e => { e.stopPropagation(); close(); }; };
  const step = d => { i = Math.max(0, Math.min(deck.slides.length - 1, i + d)); draw(); };
  const key = e => { if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) step(1); else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) step(-1); else if (e.key === 'Escape') close(); };
  const close = () => { document.removeEventListener('keydown', key, true); sh.remove(); };
  document.addEventListener('keydown', key, true);
  sh.addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
  sh.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); else step(1); });
  sh.onclick = e => { if (!('ontouchstart' in window)) step(e.clientX > innerWidth / 3 ? 1 : -1); };
  draw();
}

// ---------- export: slides drawn to pictures in the page itself, then PPTX (editable text) or PDF ----------
const libs = {};
function loadLib(name, src) { return libs[name] ??= new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => { delete libs[name]; bad(new Error('library')); }; document.head.append(s); }); }
const toDataURL = blob => new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(blob); });
async function fontCSS(st) { // the deck's two families as data URLs, so the pictures carry the real fonts
  const fams = [st.fonts.h, st.fonts.b].map(f => f.replace(/ /g, '_'));
  const rules = FONT_FACES.filter(r => fams.some(f => r.file.startsWith(f + '-')));
  const parts = await Promise.all(rules.map(async r => { try { const b = await (await fetch('fonts/' + r.file)).blob(); return r.css.replace('fonts/' + r.file, await toDataURL(b)); } catch { return ''; } }));
  return parts.join('\n');
}
async function inlineImages(root) {
  // photos go in as small JPEGs: a slide picture is one data URL, and browsers refuse very long ones
  for (const im of root.querySelectorAll('img')) {
    try {
      const bmp = await createImageBitmap(await (await fetch(im.src)).blob()), k = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      im.src = c.toDataURL('image/jpeg', 0.82);
      await im.decode().catch(() => { });
    } catch { im.remove(); }
  }
}
async function slideToCanvas(slideEl, css, mode) {
  // XMLSerializer, not outerHTML: the picture is parsed as XML, where <img> must be self-closed
  const html = new XMLSerializer().serializeToString(slideEl).replace('class="slide ', `class="slide ${mode ? 'cap-' + mode + ' ' : ''}`);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><foreignObject width="1920" height="1080"><div xmlns="http://www.w3.org/1999/xhtml"><style>${css}</style>${html}</div></foreignObject></svg>`;
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const c = document.createElement('canvas'); c.width = 1920; c.height = 1080;
  c.getContext('2d').drawImage(img, 0, 0);
  try { c.toDataURL('image/jpeg', 0.1); return c; } catch { return null; } // some browsers (Safari) refuse to export such a picture
}
// plain fallback picture: the slide's background colour and its photos, without the drawn decoration
async function plainCanvas(slideEl, est, withText) {
  const c = document.createElement('canvas'); c.width = 1920; c.height = 1080;
  const g = c.getContext('2d'); g.fillStyle = est.bg; g.fillRect(0, 0, 1920, 1080);
  const o = slideEl.getBoundingClientRect(), k = 1920 / o.width;
  for (const ph of slideEl.querySelectorAll('[data-x=p]')) {
    const im = ph.querySelector('img'); if (!im) continue;
    const r = ph.getBoundingClientRect(), x = (r.left - o.left) * k, y = (r.top - o.top) * k, w = r.width * k, h = r.height * k;
    try { await im.decode(); const s = Math.max(w / im.naturalWidth, h / im.naturalHeight), sw = w / s, sh = h / s;
      g.drawImage(im, (im.naturalWidth - sw) / 2, (im.naturalHeight - sh) / 2, sw, sh, x, y, w, h); } catch { }
  }
  if (withText) for (const t of extractTexts(slideEl)) { // PDF: the text is painted too, wrapped to its box
    g.fillStyle = '#' + t.color; g.font = `${t.italic ? 'italic ' : ''}${t.bold ? 700 : 400} ${t.size}px "${t.font}", sans-serif`; g.textBaseline = 'top'; g.textAlign = t.align;
    const lh = t.size * t.lh, x = t.align === 'center' ? t.x + t.w / 2 : t.align === 'right' ? t.x + t.w : t.x;
    let y = t.y, line = '';
    for (const para of t.text.split(/\n/)) {
      for (const word of para.split(' ')) { const tryL = line ? line + ' ' + word : word; if (g.measureText(tryL).width > t.w * 1.02 && line) { g.fillText(line, x, y); y += lh; line = word; } else line = tryL; }
      g.fillText(line, x, y); y += lh; line = '';
    }
  }
  return c;
}
function extractTexts(s) {
  const o = s.getBoundingClientRect(), k = 1920 / o.width;
  const hex = c => { const m = c.match(/[\d.]+/g) || [0, 0, 0]; return m.slice(0, 3).map(v => (+v | 0).toString(16).padStart(2, '0')).join('').toUpperCase(); };
  return [...s.querySelectorAll('[data-x=t]')].filter(e => e.innerText.trim() && e.getClientRects().length).map(e => {
    const r = e.getBoundingClientRect(), cs = getComputedStyle(e), fs = parseFloat(cs.fontSize), lh = parseFloat(cs.lineHeight);
    const pl = parseFloat(cs.paddingLeft) || 0, pt = parseFloat(cs.paddingTop) || 0;
    return { x: (r.left - o.left) * k + pl, y: (r.top - o.top) * k + pt, w: r.width * k - pl - (parseFloat(cs.paddingRight) || 0), h: r.height * k - pt - (parseFloat(cs.paddingBottom) || 0),
      text: cs.textTransform === 'uppercase' ? e.innerText.toUpperCase() : e.innerText, font: cs.fontFamily.split(',')[0].replace(/["']/g, '').trim(), size: fs, bold: +cs.fontWeight >= 600,
      italic: cs.fontStyle === 'italic', color: hex(cs.color), align: cs.textAlign === 'center' ? 'center' : (cs.textAlign === 'right' || cs.textAlign === 'end') ? 'right' : 'left', lh: isNaN(lh) ? 1.2 : +(lh / fs).toFixed(2), ls: parseFloat(cs.letterSpacing) || 0 };
  });
}
async function exportDeck(fmt, deck, st, btn) {
  const L = T();
  if (!cap.downloads) return toast(L.noDownload);
  const old = btn.textContent; btn.disabled = true;
  const stage = document.createElement('div'); stage.className = 'stage-off';
  document.body.append(stage);
  try {
    await loadLib(fmt, fmt === 'pptx' ? 'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js' : 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const est = AET.apply(st, deck.theme);
    const css = SLIDES_CSS + '\n' + await fontCSS(est);
    let out;
    if (fmt === 'pptx') { out = new PptxGenJS(); out.layout = 'LAYOUT_WIDE'; out.title = deck.title; }
    else out = new jspdf.jsPDF({ orientation: 'landscape', unit: 'px', format: [1920, 1080], hotfixes: ['px_scaling'] });
    for (let i = 0; i < deck.slides.length; i++) {
      btn.textContent = `${i + 1}/${deck.slides.length}`;
      stage.innerHTML = AER.renderSlide(deck, i, st);
      const sl = stage.firstElementChild;
      await document.fonts.ready; AER.fit(sl); await inlineImages(sl);
      if (fmt === 'pptx') {
        const bg = await slideToCanvas(sl, css, 'bg') || await plainCanvas(sl, est), IN = 144, s = out.addSlide();
        s.addImage({ data: bg.toDataURL('image/png'), x: 0, y: 0, w: 13.333, h: 7.5 });
        for (const t of extractTexts(sl)) s.addText(t.text, { x: t.x / IN, y: t.y / IN, w: (t.w * (t.align === 'left' ? 1.06 : 1)) / IN, h: t.h / IN, margin: 0, valign: 'top', align: t.align,
          fontFace: t.font, fontSize: Math.max(6, +(t.size * 0.5).toFixed(1)), bold: t.bold, italic: t.italic, color: t.color, lineSpacingMultiple: t.lh, charSpacing: t.ls ? +(t.ls * 0.5).toFixed(2) : undefined, fit: 'shrink', wrap: true });
        if (deck.slides[i].notes) s.addNotes(deck.slides[i].notes);
      } else {
        const c = await slideToCanvas(sl, css, '') || await plainCanvas(sl, est, true);
        if (i) out.addPage([1920, 1080], 'landscape');
        out.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 1920, 1080);
      }
    }
    const blob = fmt === 'pptx' ? await out.write({ outputType: 'blob' }) : out.output('blob');
    await cap.downloads.save({ filename: (deck.title || 'presentation').replace(/[\\/:*?"<>|]+/g, '').slice(0, 80) + '.' + fmt, data: blob });
    toast(fmt === 'pptx' ? L.pptxDone : L.pdfDone);
  } catch (e) {
    if (e?.code !== 'declined') toast(L.expErr + (e?.code || e?.message || e));
  } finally { stage.remove(); btn.disabled = false; btn.textContent = old; }
}

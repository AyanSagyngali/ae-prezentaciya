const SLIDES_CSS="/* Slide canvas 1920x1080. All sizes scale with --k (auto-fit). */\n.slide{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--bf),system-ui,sans-serif;font-size:calc(28px*var(--k));line-height:1.45;box-sizing:border-box}\n.slide *{box-sizing:border-box}\n.slide .sl-in{position:absolute;inset:104px 128px 120px 128px;display:flex;flex-direction:column}\n.slide h1,.slide h2,.slide p,.slide blockquote,.slide figure,.slide ul{margin:0}\n.slide .title{font-family:var(--hf),serif;font-weight:var(--hw);letter-spacing:var(--ls);text-transform:var(--tt);line-height:1.08;font-size:calc(66px*var(--k));text-wrap:balance}\n.slide .sub{font-size:calc(30px*var(--k));color:var(--mu);margin-top:calc(18px*var(--k));max-width:1300px}\n.slide .kicker{display:inline-block;font-size:calc(20px*var(--k));font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:calc(20px*var(--k))}\n.slide .krule{width:72px;height:6px;background:var(--ac);margin-bottom:22px;border-radius:3px}\n.slide:not(.dc-rule) .krule{display:none}\n.slide .lead{font-size:calc(30px*var(--k));color:var(--tx);opacity:.86;max-width:1100px;margin-top:calc(28px*var(--k))}\n.slide .head{flex:none;max-height:420px;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start}\n.slide .num{font-family:var(--hf);font-weight:var(--hw);color:var(--ac);font-size:calc(30px*var(--k));line-height:1}\n.slide .it-t{font-family:var(--hf);font-weight:var(--hw);font-size:calc(32px*var(--k));line-height:1.18;letter-spacing:var(--ls)}\n.slide .it-x{font-size:calc(24px*var(--k));color:var(--mu);margin-top:calc(10px*var(--k));line-height:1.42}\n.slide .card{background:var(--sf);border-radius:var(--r);padding:calc(36px*var(--k))}\n.slide .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ac);flex:none;margin-top:.5em}\n.slide .fit{overflow:hidden;min-height:0}\n.slide .col{overflow:hidden;min-height:0}\n\n/* photos */\n.slide .ph{position:relative;overflow:hidden;border-radius:var(--r);background:var(--sf)}\n.slide .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}\n.slide .ph-empty{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 35%,var(--sf)),color-mix(in srgb,var(--a2) 30%,var(--sf)))}\n.slide .credit{position:absolute;right:14px;bottom:10px;font-size:13px;line-height:1.2;color:#fff;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.8);max-width:80%;text-align:right;font-family:system-ui,sans-serif}\n.pt-bw .ph img{filter:grayscale(1) contrast(1.08)}\n.pt-warm .ph img{filter:sepia(.22) saturate(1.05) contrast(1.03)}\n.pt-duotone .ph img{filter:grayscale(1) contrast(1.15) brightness(.85)}\n.pt-duotone .ph::after{content:\"\";position:absolute;inset:0;background:var(--ac);mix-blend-mode:color;opacity:.75}\n.pt-rounded .ph{border-radius:calc(var(--r) + 12px)}\n.slide .side-ph{flex:0 0 40%;align-self:stretch}\n\n/* deco */\n.slide .dc{position:absolute;pointer-events:none}\n.slide .blob{border-radius:50%;background:var(--ac);opacity:.10}\n.slide .b1{width:720px;height:720px;right:-260px;top:-300px}\n.slide .b2{width:420px;height:420px;left:-180px;bottom:-220px;background:var(--a2);opacity:.12}\n.slide .bar-l{left:0;top:0;bottom:0;width:18px;background:var(--ac)}\n.slide .gridbg{inset:0;background-image:radial-gradient(var(--mu) 1.4px,transparent 1.4px);background-size:48px 48px;opacity:.22}\n.slide .frame{inset:36px;border:1.5px solid var(--ac);opacity:.7}\n.slide .corner{right:0;top:0;width:260px;height:180px;background:var(--ac);opacity:.14;border-bottom-left-radius:120px}\n.slide .stripe{left:0;right:0;top:0;height:14px;background:var(--ac)}\n.slide .bignum{right:80px;bottom:30px;font-family:var(--hf);font-weight:800;font-size:360px;line-height:1;color:var(--tx);opacity:.05;letter-spacing:-.05em}\n.dc-box .card,.dc-box .ph{border:5px solid var(--tx);box-shadow:12px 12px 0 var(--tx);border-radius:0}\n.dc-box .title{background:var(--ac);color:#0A0A0A;padding:0 .18em;display:inline;box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.22}\n.dc-box .head .title{display:inline}\n\n/* footer */\n.slide .foot{position:absolute;left:128px;right:128px;bottom:44px;display:flex;gap:40px;align-items:baseline;font-size:18px;color:var(--mu);line-height:1.2}\n.slide .f-l{flex:none;max-width:560px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.slide .f-s{flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.slide .f-n{flex:none;font-variant-numeric:tabular-nums}\n\n/* cover + end */\n.slide .cover{position:absolute;inset:-104px -128px -120px -128px}\n.slide .cover .title{font-size:calc(112px*var(--k));line-height:1.02}\n.slide .cover .sub{font-size:calc(36px*var(--k))}\n.slide .cover .meta{margin-top:calc(40px*var(--k));font-size:22px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}\n.slide .cover-ph{position:absolute;border-radius:0}\n.slide .cover-txt{position:absolute;display:flex;flex-direction:column;overflow:hidden}\n.slide .cover-txt::before,.slide .cover-txt::after{content:\"\";flex:1 1 0}\n.cv-full .cover-txt::after,.cv-type:has(.cover-ph) .cover-txt::after{flex:0 0 0}\n.cv-full .cover-ph{inset:0}\n.cv-full .cover-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(0,0,0,.78) 100%)}\n.cv-full .cover-txt{left:128px;right:300px;bottom:112px;top:120px}\n.cv-full .cover-txt .title,.cv-full .cover-txt .sub{color:#fff}\n.cv-full .cover-txt .sub{opacity:.88}\n.cv-full .cover-txt .meta{color:rgba(255,255,255,.75)}\n.cv-split .cover-ph{right:0;top:0;bottom:0;width:46%}\n.pt-rounded .cv-split .cover-ph{top:56px;bottom:56px;right:56px;width:43%;border-radius:calc(var(--r) + 20px)}\n.cv-split .cover-txt{left:128px;width:44%;top:120px;bottom:120px}\n.cv-type .cover-txt{left:128px;right:128px;top:120px;bottom:120px}\n.cv-type .cover-ph{right:128px;bottom:120px;widt hild(1) .it-x,.fam-bold .fc-list .card:nth-child(1) .it-x,.fam-bold .kp:nth-child(1) .it-x,.fam-bold .kp:nth-child(1) .it-t{color:var(--on-ac);opacity:.85}\n.fam-bold .kp:nth-child(1) .kp-v{color:var(--on-ac)}\n.fam-bold .cgrid .cd:nth-child(1) .ic,.fam-bold .fc-list .card:nth-child(1) .ic{background:var(--on-ac);color:var(--ac)}\n.fam-bold .head .title{font-size:calc(70px*var(--k));line-height:1.02}\n.fam-bold .kp-v{font-size:calc(96px*var(--k))}\n.fam-bold .take{background:var(--a2);color:var(--on-a2)}\n.fam-bold .take::before{background:var(--on-a2)}\n\n/* ---------- family: soft (rounded, tinted, no shadows) ---------- */\n.fam-soft .card{background:color-mix(in srgb,var(--ac) 8%,var(--sf));box-shadow:none;border-radius:calc(var(--r) + 6px)}\n.fam-soft .cgrid .cd:nth-child(3n+2),.fam-soft .fc-list .card:nth-child(3n+2),.fam-soft .kp:nth-child(3n+2){background:color-mix(in srgb,var(--a2) 12%,var(--sf))}\n.fam-soft .take{background:color-mix(in srgb,var(--ac) 14%,var(--sf));color:var(--tx);border-radius:999px;padding-left:44px}\n.fam-soft .take::before{background:var(--ac)}\n.fam-soft .tagpill{background:color-mix(in srgb,var(--a2) 22%,var(--sf));color:var(--tx)}\n.fam-soft .tbl table{border-radius:calc(var(--r) + 6px)}\n\n/* ---------- family: editorial (no boxes, rules and white space) ---------- */\n.fam-editorial .card{background:transparent;box-shadow:none;border-radius:0;border-top:3px solid var(--tx);padding-left:0;padding-right:12px}\n.fam-editorial .cgrid .cd:nth-child(3n+2),.fam-editorial .kp:nth-child(3n+2){border-top-color:var(--ac)}\n.fam-editorial .ic{background:none!important;color:var(--ac)!important;width:auto;height:auto;justify-content:start}\n.fam-editorial .ic svg{width:calc(56px*var(--k));height:calc(56px*var(--k));stroke-width:1.5}\n.fam-editorial .take{background:none;color:var(--tx);border-top:2px solid var(--tx);border-radius:0;padding:calc(20px*var(--k)) 0 0;font-family:var(--hf);font-size:calc(30px*var(--k));font-style:italic}\n.fam-editorial .take::before{display:none}\n.fam-editorial .tagpill{background:none;color:var(--ac);border:2px solid var(--ac)}\n.fam-editorial .kp-v{font-size:calc(100px*var(--k))}\n.fam-editorial .chev-c .card{border-top:0;border-left:3px solid var(--ac);padding:0 0 0 24px}\n.fam-editorial .cmp .cm{border-top:0}\n.fam-editorial .fc-panel{background:none;color:var(--tx);border:3px solid var(--tx);border-radius:0}\n.fam-editorial .fc-panel .kicker{color:var(--ac)}\n.fam-editorial .tbl table{background:none}\n.fam-editorial .tbl th{background:none;color:var(--tx);border-bottom:3px solid var(--tx)}\n\n/* v3b: header row (subtitle left, tag right), darker larger body text, icon beside card title */\n.slide .head{padding-right:0;align-items:stretch}\n.slide .hrow{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:calc(12px*var(--k))}\n.slide .hrow .sub{margin-top:0}\n.slide .hrow:empty{display:none}\n.slide .hrow .tagpill{position:static;flex:none;margin-left:auto}\n.slide .tagpill.abs{top:56px}\n.slide .it-x{color:var(--tx);opacity:.82;font-size:calc(29px*var(--k))}\n.slide .sl-in{inset:96px 104px 112px 104px}\n.slide .foot{left:104px;right:104px}\n.cgrid .cd{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;column-gap:22px;row-gap:18px;align-items:center;align-content:start}\n.cgrid .cd .it-x{grid-column:1 / -1;margin:0}\n.cgrid .cd .it-t{margin:0}\n.slide .cd:nth-child(3n+2) .it-t{color:var(--a2)}\n.slide .cd:nth-child(3n+3) .it-t{color:color-mix(in srgb,var(--a3) 70%,var(--tx))}\n.fam-bold .cd:nth-child(1) .it-t{color:var(--on-ac)}\n.slide .topo{opacity:.16}\n.slide .bgp{inset:0;background-size:cover;background-position:center}\n.cgrid .cd{grid-template-rows:auto auto}\n\n/* ---------- family: glass (translucent cards over glowing backdrops) ---------- */\n.fam-glass .card{background:rgba(255,255,255,.075);border:1.5px solid rgba(255,255,255,.2);box-shadow:0 10px 30px rgba(0,0,0,.25);border-radius:calc(var(--r) + 4px)}\n. rder-right:2px solid color-mix(in srgb,var(--tx) 25%,transparent)}\n.sk-rail .head,.sk-rail-plain .head{position:absolute;left:-48px;top:0;width:380px;max-height:none;padding:0}\n.sk-rail-r .head{position:absolute;right:-48px;top:0;width:380px;max-height:none;padding:0}\n.sk-rail .lay,.sk-rail-plain .lay{padding-left:422px}\n.sk-rail-r .lay{padding-right:422px}\n.sk-rail .take,.sk-rail-plain .take,.sk-rail .chips,.sk-rail-plain .chips{margin-left:422px}\n.sk-rail-r .take,.sk-rail-r .chips{margin-right:422px}\n.sk-rail .foot,.sk-rail-plain .foot{left:526px}\n.sk-rail-r .foot{right:526px}\n.sk-rail .head .title,.sk-rail-plain .head .title,.sk-rail-r .head .title{font-size:calc(46px*var(--k));line-height:1.1}\n.sk-rail .head .title,.sk-rail .head .sub,.sk-rail .head .kicker,.sk-rail-r .head .title,.sk-rail-r .head .sub,.sk-rail-r .head .kicker{color:var(--on-ac)}\n.sk-rail .head .sub,.sk-rail-r .head .sub{opacity:.85;font-style:normal}\n.sk-rail .head .hrow,.sk-rail-plain .head .hrow,.sk-rail-r .head .hrow{flex-direction:column;align-items:flex-start;gap:16px}\n.sk-rail .hrow .tagpill,.sk-rail-r .hrow .tagpill{background:var(--a2);color:var(--on-a2);margin-left:0}\n.sk-rail-plain .hrow .tagpill{margin-left:0}\n.sk-rail .tagpill.abs,.sk-rail-plain .tagpill.abs,.sk-rail-r .tagpill.abs{display:none}\n.sk-rail .cgrid,.sk-rail-r .cgrid,.sk-rail-plain .cgrid{grid-template-columns:repeat(2,1fr)}\n.sk-rail .kpis,.sk-rail-r .kpis,.sk-rail-plain .kpis{grid-template-columns:repeat(2,1fr)}\n\n/* ---- index: a huge slide number stands left of the title (Swiss poster) ---- */\n.sk-index::after{content:attr(data-n);position:absolute;left:96px;top:56px;font-family:var(--hf);font-weight:800;font-size:230px;line-height:1;letter-spacing:-.07em;color:var(--ac);z-index:0}\n.sk-index .bignum{display:none}\n.sk-index .head{padding-left:360px;min-height:190px;border-bottom:4px solid var(--tx);padding-bottom:26px}\n.sk-index .head .title{font-size:calc(58px*var(--k));letter-spacing:-.04em}\n.sk-index .tagpill.abs{display:none}\n\n/* ---- masthead: newspaper title block, double rule ---- */\n.sk-masthead .head,.sk-gold .head{align-items:center;text-align:center}\n.sk-masthead .head{border-top:7px double var(--tx);border-bottom:2px solid var(--tx);padding:22px 0 20px}\n.sk-masthead .head .title{font-size:calc(60px*var(--k))}\n.sk-masthead .hrow,.sk-gold .hrow{justify-content:center}\n.sk-masthead .hrow .tagpill,.sk-gold .hrow .tagpill{margin-left:18px}\n.sk-masthead .tagpill.abs,.sk-gold .tagpill.abs{display:none}\n.sk-masthead .foot{border-top:2px solid var(--tx);padding-top:10px}\n.sk-masthead .card{border-top:0;border-left:2px solid var(--tx);padding-left:22px}\n.sk-masthead .lay{column-rule:none}\n.sk-gold .head{padding-bottom:26px;position:relative}\n.sk-gold .head::after{content:\"\";position:absolute;left:30%;right:30%;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--ac),transparent)}\n.sk-gold .head .title{font-weight:600;letter-spacing:.02em}\n\n/* ---- frame: museum page with a double border and an ornament under the title ---- */\n.sk-frame::before{content:\"\";position:absolute;inset:30px;border:3px double var(--ac);pointer-events:none;z-index:3}\n.sk-frame .head{align-items:center;text-align:center}\n.sk-frame .head::after{content:\"❦\";display:block;color:var(--ac);font-size:30px;margin:10px auto 0}\n.sk-frame .hrow{justify-content:center}\n.sk-frame .tagpill.abs{display:none}\n\n/* ---- window: terminal window chrome with a prompt before the title ---- */\n.sk-window::before{content:\"\";position:absolute;left:0;right:0;top:0;height:62px;background:var(--sf);border-bottom:1px solid color-mix(in srgb,var(--tx) 18%,transparent)}\n.sk-window::after{content:\"\";position:absolute;left:30px;top:22px;width:18px;height:18px;border-radius:50%;background:#FF5F56;box-shadow:32px 0 #FFBD2E,64px 0 #27C93F}\n.sk-window .head .title::before{content:\"> \";color:var(--ac)}\n.sk-window .head .sub::before{content:\"# \";color:var(--mu)} // light / dark switch for the app (slides keep their own style)
(function () {
  const KEY = 'aep_theme';
  const get = () => { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } };
  const apply = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; const b = document.getElementById('themeb'); if (b) b.textContent = isDark() ? '☀️' : '🌙'; };
  const isDark = () => document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  apply(get());
  const mount = () => {
    const h = document.querySelector('.hright'); if (!h || document.getElementById('themeb')) return;
    const b = document.createElement('button'); b.id = 'themeb'; b.className = 'gear themeb'; b.setAttribute('aria-label', 'Тема');
    b.onclick = () => { const t = isDark() ? 'light' : 'dark'; try { localStorage.setItem(KEY, t); } catch { } apply(t); };
    h.prepend(b); apply(get());
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();

      else { ph.style.width = 'auto'; ph.style.flex = '0 0 auto'; ph.style.alignSelf = 'stretch'; }
      ph.classList.add('ph-cover');
    }
  }
  function fit(slide) {
    if (slide.classList.contains('nx')) return NX.fit(slide);
    slide.querySelectorAll('img.ph-im').forEach(im => { if (im.complete) phFit(im); });
    let k = 1;
    slide.style.setProperty('--k', 1);
    const over = () => [...slide.querySelectorAll('.fit, .cover-txt, .col, .lay')].some(e => e.scrollHeight > e.clientHeight + 12) ||
      [...slide.querySelectorAll('.title')].some(e => e.scrollWidth > e.clientWidth + 4); // a long word in a narrow column
    while (over() && k > 0.62) { k -= 0.05; slide.style.setProperty('--k', k.toFixed(2)); }
  }

  function fontsHref(styles) {
    const fams = new Set();
    const wg = new Map();
    styles.forEach(s => { [s.fonts.h, s.fonts.b].forEach(f => { fams.add(f); if (s.fonts.w) wg.set(f, s.fonts.w); else if (!wg.has(f)) wg.set(f, null); }); });
    return 'https://fonts.googleapis.com/css2?' + [...fams].map(f => 'family=' + f.replace(/ /g, '+') + ':wght@' + (wg.get(f) || '400;500;600;700;800')).join('&') + '&display=swap';
  }

  window.AER = { renderSlide, fit, phFit, fontsHref, LAYOUTS, esc, chart };
})();

const LIMITS = { agenda: 6, bullets: 5, 'two-col': 4, kpi: 4, timeline: 6, process: 5, comparison: 3, summary: 4, cards: 6, focus: 3, facts: 4, sources: 12, dossier: 7, 'before-after': 2 };
const LAYOUTS = ['title', 'agenda', 'section', 'statement', 'bullets', 'cards', 'focus', 'facts', 'table', 'two-col', 'quote', 'big-number', 'kpi', 'timeline', 'process', 'comparison', 'chart', 'gallery', 'summary', 'sources', 'dossier', 'before-after', 'end'];
const ICONS = 'landmark scale gavel map map-pin mountain trees droplets sun wind snowflake cloud-rain flame factory tractor wheat sprout leaf recycle fish users user baby graduation-cap school book-open lightbulb brain target flag trophy award star shield shield-check triangle-alert circle-check circle-x clock calendar trending-up trending-down chart-column chart-pie coins wallet banknote briefcase building-2 house hospital heart-pulse stethoscope syringe microscope flask-conical atom dna cpu smartphone globe plane train-front car ship truck zap battery-charging palette music camera film message-circle search file-text clipboard-check handshake rocket layers settings link lock eye compass route mail phone hammer ruler utensils shopping-cart thermometer bug'.split(' ');
const CANCELLED = 'Отменено';
const LANG = {
  ru: 'Весь текст слайдов пиши на русском языке. Русская типографика: «ёлочки», тире —.',
  kk: 'Весь текст слайдов пиши на казахском языке (қазақ тілі) — сразу по-казахски, как пишет казахский учёный или преподаватель, а не перевод с русского. Строго соблюдай нормы казахского литературного языка: орфографию (кириллица с ә, ғ, қ, ң, ө, ұ, ү, һ, і), закон сингармонизма (үндестік заңы) в окончаниях и суффиксах, правильные падежные окончания, порядок слов (сказуемое в конце), согласование, официальную казахскую терминологию (Жер кодексі, аудан, облыс, әкімдік, шаруа қожалығы, жайылым, т. б.). Не калькируй русские обороты и не вставляй русские слова, если есть казахский термин. Кавычки «», тире —.'
};

const RULES = `Задача: презентация должна по-настоящему объяснять и раскрывать тему, как у сильного эксперта, а не у нейросети. Образец уровня — хорошая защита в вузе или доклад консультанта: каждый слайд плотный, конкретный и визуальный.
Правила текста:
- Конкретика: факты, даты, имена, места, законы и статьи, механизмы, причины и следствия, примеры из жизни. Каждый слайд добавляет новое знание, без повторов.
- Заголовок слайда — вывод или мысль (до 10 слов), а не тема. Плохо: «Преимущества». Хорошо: «Ветряки дешевле угля уже в 30 странах».
- subtitle у содержательных слайдов — короткий курсивный подзаголовок (3–7 слов), уточняет контекст.
- Служебные метки-шпаргалки запрещены: не заполняй поля tag, kicker, chips (никаких «ФАКТЫ», «АНАЛИЗ», «ТЕГ»). Только содержательный текст.
- takeaway — главный вывод слайда одной фразой до 20 слов. Ставь его у большинства содержательных слайдов.
- Не выдумывай контакты, e-mail, телефоны, сайты и ссылки.
- Запрещены штампы: «в современном мире», «играет ключевую роль», «важно отметить», «уникальный», «инновационный», «давайте рассмотрим», «таким образом», эмодзи, восклицательные знаки. Заголовки «Введение»/«Заключение» запрещены.
- Цифры только достоверные, с полем source (организация или документ и год). Если не уверен в точной цифре — не выдумывай, пиши качественно или «≈».
- Плотно и конкретно, как в хорошей курсовой или отчёте: на каждом содержательном слайде не меньше 3–4 проверяемых деталей — числа с единицами, даты, названия мест, организаций, документов и статей, имена, примеры из Казахстана, если тема о нём.
- В пунктах и box.points можно писать «Метка: значение» (например «Орталығы: Қарқаралы қаласы, 1824 ж.») — метка будет выделена жирным.
- Пиши как живой эксперт: без общих фраз, без пустых вводных, без «является важным», без пересказа заголовка. Каждое предложение несёт факт или вывод.
- Объём: text до 45 слов, text в пунктах 12–28 слов, title пункта 2–5 слов.
- История связная: вступление → суть → детали, данные и примеры → проблемы → решения → итог.
- Сначала продумай логику рассказа (идея из сильных презентаций): заголовки слайдов подряд должны читаться как цепочка доводов «тезис → доказательство → вывод», где каждый следующий слайд отвечает на вопрос предыдущего. Никаких слайдов «для объёма».
- Разнообразие: используй разные макеты, не ставь один макет два раза подряд. Почти каждый слайд несёт визуальный элемент: фото, иконки, цифры, таблицу, график или шаги.
ЖЁСТКИЕ ПРАВИЛА (нарушать нельзя):
1. Достоверность важнее красоты. Не выдумывай факты, даты, имена, цитаты, премии, названия спектаклей, книг, законов и цифры. Если не уверен — не пиши это вовсе. Лучше меньше, но точно.
2. Если в «Требованиях автора» дан готовый текст или сценарий по слайдам — бери его смысл и формулировки, ничего не добавляй от себя и не меняй факты; только раздели по слайдам и сократи под лимиты.
3. Если источники расходятся в дате — не ставь точный год, пиши период («в середине 1970-х»).
4. Цитата (макет quote) — только реальная, дословная, с реальным автором. Нет точной цитаты — не используй макет quote.
5. Никаких «воды» и общих фраз: каждая строка — факт, имя, дата, число или конкретный вывод. Не повторяй одно и то же на разных слайдах.
6. Строго соблюдай лимиты слов: длинный текст будет обрезан на слайде. Заголовок до 10 слов, пункт до 28 слов.
7. Не пиши в тексте номера слайдов, слова «Слайд 3», служебные пометки, markdown (**, #), эмодзи.
8. Ровно столько слайдов, сколько просили. Ровно тот язык, который просили.
9. Для темы о конкретном человеке imageQuery — его полное имя латиницей (например "Lev Dodin"), для спектакля — название и театр, для места — точное название места.`;

const LAYOUT_SPEC = `Макеты (поле layout) и их поля:
- title: title, subtitle, text (короткая строка вроде «Лекция · 2026»). Всегда первый слайд.
- agenda: title, items[3–6]{title,text}.
- section: title, subtitle — разделитель главы. Нужен фото imageQuery.
- statement: title (сильная мысль до 14 слов), text.
- bullets: title, subtitle, text (необязательно), items[3–5]{title,text}.
- cards: title, subtitle, items[4–6]{icon,title,text} — карточки с иконками.
- focus: title, subtitle, label (крупная метка: статья закона, год, термин, число — до 12 знаков), text (что это), items[3]{icon,title,text}.
- facts: title, subtitle, items[3–4]{value (напр. "23 400 км²"), title (что это)}, box{title, points[3–4] строки}, text (необязательно). Требует фото.
- table: title, subtitle, table{head[2–4] (названия столбцов), rows[3–7] (массивы строк, по одной ячейке на столбец), highlight (индекс важной строки или null)}, source.
- two-col: title, subtitle, text (абзац 30–45 слов), items[0–3]{title,text}. Требует фото.
- quote: quote (реальная цитата реального человека), author (имя), subtitle (кто он, год).
- big-number: number (только цифры, напр. "71"), unit (напр. "%"), title (что это значит), text, source.
- kpi: title, subtitle, items[3–4]{value, title, text}, source.
- timeline: title, subtitle, items[4–6]{value (год/дата), title, text}.
- process: title, subtitle, items[3–5]{title (2–3 слова), text} — шаги, этапы, порядок.
- comparison: title, subtitle, items[2–3]{title, points[3–4] (строки)}, text (вывод).
- chart: title (вывод из данных), subtitle, chart{type ("bar" или "donut" для долей), labels[2–8], values[числа], unit}, items[0–2]{value,title} — ключевые цифры рядом, text (объяснение 15–30 слов), source. Только реальные данные.
- dossier: title, subtitle, label (заголовок карточки, напр. «Паспорт района»), items[5–7]{title (метка: «Площадь», «Население», «Центр»), text (значение с единицами)}, source. Нужен фото imageQuery. Для паспорта места, человека, объекта, закона.
- before-after: title (вывод), subtitle, items[2]{title («Было 2015» / «Стало 2024»), value (число с единицами), text (1 фраза), points[0–3]}, number (разница, напр. «+38%»), unit (что изменилось), text (вывод). Для сравнения «было/стало», «до/после реформы».
- gallery: title, images[3]{query, caption}.
- summary: title, items[3–4]{title,text} — главные выводы.
- sources: title, items[4–10]{title (книга, закон, сайт, организация и год)} — список источников.
- end: title (короткая финальная мысль или благодарность), subtitle.
imageCaption — подпись к фото на языке презентации: кто или что на снимке и год (только если год точно известен), до 14 слов. Пиши только то, что действительно показывает запрошенное фото (имя, место, событие), без выдумок и без слов «архивное фото». У каждого слайда с фото поле imageCaption обязательно.
icon — одно имя из списка: ${ICONS.join(', ')}.
Фото должны строго соответствовать теме. У каждого слайда с фото: imageQuery и imageMust — 1–2 английских слова, которые обязательно есть в описании нужного фото (конкретный объект, а не общее слово: «solar power plant», а не «solar»; место и объект, оба слова обязательны: "Karkaraly", "yurt", "Lake Balkhash"). На верхнем уровне JSON поле imageMust — главный объект всей темы на английском (место или предмет). Фото без этих слов не берётся.
Фото: реальные фотографии ищутся в Wikimedia Commons по полю imageQuery (на английском, 2–5 слов, конкретный предмет, место, событие или вид людей, который реально сфотографирован: "Lake Baikal ice winter", "wheat harvest Kazakhstan", "surgeon operating room"; не абстракции). Фото несут макеты title, section, statement, bullets, two-col, quote, big-number, facts, dossier, summary, end и gallery: не меньше 70% слайдов презентации должны быть этими макетами, и у каждого из них обязательно imageQuery и imageMust (у gallery вместо этого images[].query и must). Макеты без фото (agenda, cards, focus, table, chart, kpi, timeline, process, comparison, sources) — не больше 30% слайдов. Подряд не ставь больше двух макетов без фото.
У каждого слайда поле notes — 2–4 предложения, что сказать докладчику.`;

function intro({ topic, count, wishes, style, lang }) {
  return `Тема презентации: ${topic}
Число слайдов: ровно ${count}.
Стиль оформления: «${style.name}» (${style.tag}). ${style.desc}${style.upper ? ' Стиль крупный: заголовки до 6 слов.' : ''}
${style.voice ? `Подача текста в этом стиле: ${style.voice}\n` : ''}${style.prefer ? `Любимые макеты этого стиля, ставь их чаще остальных (но не подряд): ${style.prefer.join(', ')}.\n` : ''}${LANG[lang] || LANG.ru}
${wishes ? 'Требования автора (выполни обязательно): ' + wishes : ''}`;
}
const ORDER = count => `Порядок: первый слайд title, последний end, предпоследний summary${count >= 16 ? ', перед ним sources' : ''}. ${count >= 12 ? `Второй слайд agenda (план). Раздели презентацию на ${Math.max(2, Math.min(6, Math.round(count / 8)))} главы слайдами section.` : ''} Используй не меньше ${Math.min(10, Math.max(6, Math.round(count / 2)))} разных макетов.`;

function buildPrompt(o) {
  return `Сделай презентацию.\n${intro(o)}\n\n${RULES}\n\n${LAYOUT_SPEC}\n${ORDER(o.count)}\n\nВерни только JSON:\n{"title":"...","subtitle":"...","imageTopic":"общий запрос на английском для фото по теме","imageMust":"главный объект темы на английском","slides":[{"layout":"title",...}, ...]}`;
}
function outlinePrompt(o) {
  return `Составь подробный план презентации.\n${intro(o)}\n\n${RULES}\n\n${LAYOUT_SPEC}\n${ORDER(o.count)}\n\nСейчас нужен только план: для каждого из ${o.count} слайдов layout, title (окончательный заголовок на языке презентации) и brief (1–2 предложения на русском: что именно на слайде, какие факты, цифры, примеры). Не повторяй темы между слайдами.\nВерни только JSON:\n{"title":"...","subtitle":"...","imageTopic":"...","imageMust":"главный объект темы на английском","slides":[{"layout":"...","title":"...","brief":"..."}, ...]}`;
}
function chunkPrompt(o, outline, from, to) {
  return `Пишем презентацию по готовому плану.\n${intro(o)}\n\n${RULES}\n\n${LAYOUT_SPEC}\n\nПлан всей презентации:\n${JSON.stringify(outline.slides.map((s, i) => ({ n: i + 1, layout: s.layout, title: s.title, brief: s.brief })))}\n\nЗаполни полностью слайды с номерами ${from + 1}–${to + 1} (всего ${to - from}) строго по их плану: тот же layout и заголовок, все поля макета, конкретные факты из brief. Остальные слайды не пиши.\nВерни только JSON: {"slides":[...]} — ровно ${to - from} объектов по порядку.`;
}

function parseJSON(s) {
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('В ответе нет JSON');
  return JSON.parse(s.slice(a, b + 1));
}

const NEEDS_ITEMS = ['bullets', 'agenda', 'kpi', 'timeline', 'process', 'summary', 'comparison', 'cards', 'focus', 'facts', 'sources', 'dossier', 'before-after'];
function normSlide(s) {
  const str = v => (v === undefined || v === null) ? undefined : String(v).trim() || undefined;
  const o = { layout: LAYOUTS.includes(s.layout) ? s.layout : 'bullets' };
  for (const k of ['kicker', 'title', 'subtitle', 'text', 'quote', 'author', 'number', 'unit', 'source', 'notes', 'imageQuery', 'imageMust', 'imageCaption', 'tag', 'takeaway', 'label']) if (str(s[k])) o[k] = str(s[k]);
  if (Array.isArray(s.items)) o.items = s.items.slice(0, LIMITS[o.layout] || 5).map(it => typeof it === 'string' ? { title: it } :
    { title: str(it.title)?.replace(/^\s*\d{1,2}\s*[.)]\s*/, ''), text: str(it.text), value: str(it.value), icon: ICONS.includes(it.icon) ? it.icon : undefined, points: Array.isArray(it.points) ? it.points.slice(0, 5).map(String) : undefined });
  if (s.chips && Array.isArray(s.chips.items) && s.chips.items.length) o.chips = { label: str(s.chips.label), items: s.chips.items.slice(0, 5).map(String) };
  if (s.box) o.box = { title: str(s.box.title), points: Array.isArray(s.box.points) ? s.box.points.slice(0, 5).map(String) : [] };
  if (s.table && Array.isArray(s.table.rows) && s.table.rows.length) {
    const head = (s.table.head || []).slice(0, 5).map(String), w = head.length || (s.table.rows[0] || []).length;
    o.table = { head, rows: s.table.rows.slice(0, 8).map(r => (Array.isArray(r) ? r : [r]).slice(0, w).map(c => String(c ?? ''))), highlight: Number.isInteger(s.table.highlight) ? s.table.highlight : null };
  } else if (o.layout === 'table') o.layout = 'bullets';
  if (s.chart && Array.isArray(s.chart.values)) {
    const values = s.chart.values.map(v => parseFloat(String(v).replace(',', '.').replace(/[^\d.\-]/g, ''))).filter(v => !isNaN(v)).slice(0, 8);
    o.chart = { type: s.chart.type === 'donut' ? 'donut' : 'bar', labels: (s.chart.labels || []).slice(0, values.length).map(String), values, unit: str(s.chart.unit) };
    if (!values.length) { o.layout = 'bullets'; delete o.chart; }
  } else if (o.layout === 'chart') o.layout = 'statement';
  if (o.layout === 'gallery') o.images = (s.images || []).slice(0, 3).map(im => ({ query: str(im.query), must: str(im.must), caption: str(im.caption) }));
  if (NEEDS_ITEMS.includes(o.layout) && !(o.items || []).length) o.layout = 'statement';
  return o;
}

function normalize(raw, count) {
  const str = v => (v === undefined || v === null) ? undefined : String(v).trim() || undefined;
  const slides = (Array.isArray(raw.slides) ? raw.slides : []).map(normSlide).slice(0, count);
  if (!slides.length) throw new Error('Модель вернула пустую презентацию');
  return { title: str(raw.title) || slides[0].title || 'Презентация', subtitle: str(raw.subtitle), imageTopic: str(raw.imageTopic), imageMust: str(raw.imageMust), slides };
}

async function askJSON(prompt, job) {
  let last;
  for (let a = 0; a < 2; a++) {
    if (job?.cancelled) throw new Error(CANCELLED);
    const out = await runAI(prompt + (last ? `\n\nПрошлый ответ не разобрался как JSON (${last}). Верни строго валидный JSON.` : ''), job);
    try { return parseJSON(out); } catch (e) { last = e.message; }
  }
  throw new Error('ИИ вернул неверный ответ. Нажмите «Повторить». (' + last + ')');
}

// Kazakh editor: a second AI reads every text and fixes spelling, endings (vowel harmony), cases and calques,
// returning the same JSON; only strings in the same places are taken, so the structure can't be broken
const TEXT_KEYS = ['kicker', 'title', 'subtitle', 'text', 'quote', 'author', 'tag', 'takeaway', 'label', 'unit', 'notes', 'imageCaption'];
function textsOf(s) {
  const o = {};
  for (const k of TEXT_KEYS) if (typeof s[k] === 'string') o[k] = s[k];
  if (s.items) o.items = s.items.map(it => ({ title: it.title, text: it.text, value: it.value, points: it.points }));
  if (s.box) o.box = { title: s.box.title, points: s.box.points };
  if (s.chips) o.chips = { label: s.chips.label, items: s.chips.items };
  if (s.table) o.table = { head: s.table.head, rows: s.table.rows };
  if (s.chart) o.chart = { labels: s.chart.labels };
  if (s.images) o.images = s.images.map(im => ({ caption: im.caption }));
  return o;
}
const MERGE_KEYS = new Set([...TEXT_KEYS, 'items', 'value', 'points', 'box', 'chips', 'table', 'head', 'rows', 'chart', 'labels', 'images', 'caption']);
function mergeTexts(dst, src) { // copy corrected strings only where the original has a string in the same place
  if (!src || typeof src !== 'object') return;
  for (const k of Object.keys(src)) {

async function pool(tasks, n) {
  const res = []; let i = 0;

const CHAT_RULES = `Ты — редактор готовой презентации. Пользователь пишет, что изменить. Выполни ТОЛЬКО то, что он просит.

  async function findPhoto(q, must, used) {
    const m = must || '';
    const tries = [q, m && q && words(q).filter(w => !words(m).includes(w)).slice(0, 1).concat(words(m)).join(' '), m].filter((x, i, a) => x && a.indexOf(x) === i);
    for (const t of tries) { try { const f = await commons(t, used, m); if (f) return f; } catch { } }
    if (/^\p{Lu}/u.test(m)) return wikiLead(m, used);
    return null;
  }
  // Photos: candidates for every slide, then ONE text call where the AI "inspector" reads each candidate's file name and
  // description against the slide and picks the one that really shows the subject, or rejects them all (no photo beats a wrong one).
  window.AEP_PHOTOS = async (deck, job) => {
    const used = new Set(), tasks = [];
    deck.slides.forEach((s, i) => {
      if (s.imageQuery) tasks.push({ id: tasks.length, slide: s.title || deck.title, q: s.imageQuery, must: s.imageMust || deck.imageMust, set: v => s.image = v });
      (s.images || []).forEach(im => tasks.push({ id: tasks.length, slide: im.caption || s.title || deck.title, q: im.query, must: im.must || deck.imageMust, set: v => Object.assign(im, v) }));
    });
    job.total = tasks.length; job.n = 0;
    const queue = [...tasks];
    const worker = async () => {
      for (let t; !job.cancelled && (t = queue.shift());) {
        t.cands = [];
        try {
          const seen = new Set();
          for (const q of [t.q, t.must].filter(Boolean)) {
            for (const p of await commonsAll(q, seen, t.must)) if (t.cands.length < 6) { t.cands.push(p); seen.add(p.title); }
            if (t.cands.length >= 5) break;
          }
          if (!t.cands.length && /^\p{Lu}/u.test(t.must || '')) { const f = await wikiLead(t.must, new Set()); if (f) t.lead = f; }
        } catch { }
        job.n++;
      }
    };
    await Promise.all([worker(), worker()]);
    if (job.cancelled) return;
    // the inspector (one call for the whole deck)
    const withC = tasks.filter(t => t.cands.length > 1);
    let verdict = {};
    if (withC.length) {
      try {
        const payload = withC.map(t => ({ id: t.id, slide: t.slide, topic: deck.topic, want: t.q, candidates: t.cands.map((p, i) => ({ i, file: p.title.replace(/^File:/, '').slice(0, 90), about: strip(p.imageinfo[0].extmetadata?.ImageDescription?.value).slice(0, 140) })) }));
        const r = await gemini('You are a strict photo editor of a presentation. For every item choose the ONE candidate photo that really shows what the slide is about (judge by file name and description). If none clearly fits, answer -1: a missing photo is better than a wrong one. Never choose maps, logos, diagrams or unrelated subjects. Reply only JSON: [{"id":number,"pick":number}].\n\n' + JSON.stringify(payload));
        const arr = JSON.parse(r.text.slice(r.text.indexOf('['), r.text.lastIndexOf(']') + 1));
        for (const x of arr) verdict[x.id] = x.pick;
      } catch { /* no verdict: the strict ranking below decides */ }
    }
    for (const t of tasks) {
      let p = null;
      // the inspector's pick first, then the other candidates; a file already used on another slide is skipped
      if (t.cands.length) { const k = t.id in verdict ? verdict[t.id] : 0; if (k >= 0) p = [t.cands[k], ...t.cands.filter((_, j) => j !== k)].filter(Boolean).find(c => !used.has(c.title)) || null; }
      if (p) { used.add(p.title); t.set(pick(p, new Set())); } else if (t.lead) t.set(t.lead);
    }
  };
  window.AEP_FIND_PHOTO = findPhoto;
})();

// files are saved through the downloads capability. No laptop needed.

// ---------- AI: the laptop's prompts, answered by Claude through the artifact ----------
const NO_PHOTO = 'Фото не нужны: не пиши поля imageQuery, imageMust и images.';
async function runAI(prompt, job) {
  if (!cap.sample) throw new Error(T().noClaude);
  // photos are added by hand on the phone (the page cannot reach Wikimedia), so the photo rules are dropped
  if (!window.AEP_PHOTOS) prompt = prompt.replace(/Фото должны строго[\s\S]*?images\[\]\.query\./, NO_PHOTO);
  const ctl = new AbortController();
  (job.ctls ??= new Set()).add(ctl);
  try { return (await cap.sample(prompt, { signal: ctl.signal, cache: false, temperature: job.temperature })).text; }
  catch (e) { throw new Error(e.code === 'cancelled' ? CANCELLED : aiError(e)); }
  finally { job.ctls.delete(ctl); }
}
function aiError(e) {
  const L = T();
  return ({ no_key: L.errNoKey, bad_key: L.errBadKey, not_granted: L.errGrant, sampling_disabled: L.errGrant, rate_limited: L.errRate, session_expired: L.errSession })[e.code] || (L.errAI + (e.message ? ' (' + e.code + ')' : ''));
}

async function generateDeck(job, { topic, count, wishes, styleId, lang, org, author, theme }) {
  const style = styleOf(styleId);
  lang = lang === 'kk' ? 'kk' : 'ru';
  count = Math.max(5, Math.min(50, Number(count) || 10));
  const o = { topic, count, wishes, style, lang };
  job.step = 'text';
  let raw;
  if (count <= 14) raw = await askJSON(buildPrompt(o), job);
  else {
    job.sub = 'plan';
    const outline = await askJSON(outlinePrompt(o), job);
    outline.slides = (outline.slides || []).slice(0, count);
    const ranges = [];
    for (let a = 0; a < outline.slides.length; a += 8) ranges.push([a, Math.min(outline.slides.length, a + 8)]);
    job.sub = 'parts'; job.n = 0; job.total = ranges.length;
    const parts = await pool(ranges.map(([a, b]) => async () => {
      const r = await askJSON(chunkPrompt(o, outline, a, b), job);
      job.n++;
      const got = Array.isArray(r.slides) ? r.slides : [];
      return outline.slides.slice(a, b).map((plan, i) => ({ ...plan, ...(got[i] || {}), layout: plan.layout }));
    }), 2);
    raw = { ...outline, slides: parts.flat() };
  }
  if (job.cancelled) throw new Error(CANCELLED);
  const deck = { id: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), styleId: style.id, theme: { seed: (Math.random() * 1e9) | 0, ...(theme || {}) },
    lang, topic, wishes, createdAt: new Date().toISOString(), ...normalize(raw, count) };
  if (lang === 'kk') { job.step = 'proof'; job.sub = null; job.n = 0; await proofreadKk(deck, job); }
  const first = deck.slides[0];
  if (first && first.layout === 'title' && (org || author)) { if (org) first.org = String(org).trim(); if (author) first.author = String(author).trim(); }
  if (window.AEP_PHOTOS) { job.step = 'photos'; job.n = 0; await window.AEP_PHOTOS(deck, job); }
  for (const s of deck.slides) if (s.layout === 'gallery' && (s.images || []).filter(im => im.src).length < 2) { // no photos: the captions become a list
    s.layout = 'bullets'; s.items = (s.images || []).filter(im => im.caption).map(im => ({ title: im.caption })); delete s.images;
    if (!s.items.length) s.layout = 'statement';
  }
  if (job.cancelled) throw new Error(CANCELLED);
  job.step = 'layout';
  return deck;
}

// ---------- storage: private rows in the viewer's own area, else this browser ----------
const local = () => { try { return JSON.parse(ls.get('aep_decks') || '{}'); } catch { return {}; } };
const store = {
  col: () => cap.db && uid ? cap.db.collection(`data/users/${uid}`) : null,
  async list() {
    const c = this.col();
    if (c) { const q = await c.get(); return q.docs.map(d => d.data()).filter(Boolean).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt))); }
    return Object.values(local()).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  },
  async get(id) { const c = this.col(); if (c) { const d = await c.doc(id).get(); return d.exists ? JSON.parse(JSON.stringify(d.data())) : null; } return local()[id] || null; },
  async put(deck) { const c = this.col(); if (c) return c.doc(deck.id).set(JSON.parse(JSON.stringify(deck))); const all = local(); all[deck.id] = deck; ls.set('aep_decks', JSON.stringify(all)); },
  async del(id) { const c = this.col(); if (c) return c.doc(id).delete(); const all = local(); delete all[id]; ls.set('aep_decks', JSON.stringify(all)); }
};

function runGenerate(body) {
  const L = T();
  const steps = [['text', L.stText], ...(body.lang === 'kk' ? [['proof', L.stProof]] : []), ...(window.AEP_PHOTOS ? [['photos', L.stPhotos]] : []), ['layout', L.stLayout]];
  const ov = sheet(`<h3>${L.making}</h3><div class="sub">${esc(body.topic)} · ${body.count} ${L.slides}</div>
    <div class="osteps">${steps.map(([k, t], i) => `<div class="ostep" data-k="${k}"><i>${i + 1}</i>${t}</div>`).join('')}</div>
    <div class="pbar"><b></b></div><div class="now"><span id="msg">${L.starting}</span><span id="tm">0:00</span></div><div id="err"></div>
    <button class="btn ghost stop" id="stop">${L.cancel}</button>`);
  const job = {}, t0 = Date.now();
  const paint = () => {
    const idx = steps.findIndex(s => s[0] === job.step);
    ov.querySelectorAll('.ostep').forEach((el, i) => { el.classList.toggle('ok', i < idx); el.classList.toggle('on', i === idx); });
    const part = job.sub === 'parts' && job.total ? job.n / job.total : 0;
    $('.pbar b', ov).style.width = (job.step === 'photos' ? 86 + 10 * ((job.n || 0) / (job.total || 1)) : job.step === 'proof' ? 80 : job.step === 'layout' ? 96 : 6 + 70 * part + Math.min(12, (Date.now() - t0) / 8000)) + '%';
    $('#msg', ov).textContent = job.step === 'photos' ? L.photos(job.n || 0, job.total || 0) : job.step === 'proof' ? L.stProof : job.sub === 'plan' ? L.plan : job.sub === 'parts' ? L.parts(Math.min(job.total, (job.n || 0) + 1), job.total) : L.stText;
    const s = (Date.now() - t0) / 1000 | 0; $('#tm', ov).textContent = `${s / 60 | 0}:${String(s % 60).padStart(2, '0')}`;
  };
  const tick = setInterval(paint, 1000);
  $('#stop', ov).onclick = () => { job.cancelled = true; (job.ctls || []).forEach(c => c.abort()); clearInterval(tick); ov.remove(); toast(L.cancelled); };
  generateDeck(job, body).then(async deck => {
    clearInterval(tick);
    if (job.cancelled) return;
    try { await store.put(deck); } catch (e) { toast(L.saved + (e.message || e.code)); }
    ls.set('aep_draft', '{}');

// chat edit on the phone: the shared prompt and operation checker, photos from Wikimedia when the page can reach it
async function chatEdit(deck, msg, cur) {
  const job = { temperature: 0.2 };
  const r = await askJSON(chatPrompt(deck, msg, cur, styleOf(deck.styleId).name), job);
  const out = applyChatOps(deck, r);
  for (const [s, q] of out.photos) {
    if (!window.AEP_FIND_PHOTO) break;
    try { const used = new Set(out.deck.slides.map(x => x.image && x.image.page).filter(Boolean)); const f = await window.AEP_FIND_PHOTO(q, '', used); if (f) { s.image = f; s.imageQuery = q; out.applied++; } } catch { }
  }
  if (!out.applied) return { applied: false, reply: out.reply };
  if (out.deck.lang === 'kk' && out.changed.length) await proofreadKk({ slides: out.changed, title: out.deck.title }, job);
  return { applied: true, deck: out.deck, reply: out.reply };
}

// a phone photo: shrunk to 1600 px, kept in the artifact's asset store (else inline, smaller)
async function storePhoto(file) {
  const img = await createImageBitmap(file);
  const shrink = async (max, q) => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return new Promise(ok => c.toBlob(ok, 'image/jpeg', q)); };
  if (cap.assets) { try { const r = await cap.assets.upload(await shrink(1600, .85)); return r.url; } catch { } }
  const blob = await shrink(900, .72);
  return await new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(blob); });
}

function show(deck, st, start) {
  const sh = document.createElement('div'); sh.className = 'show';
  document.body.append(sh);
  let i = start, x0 = null;
  let dir = 1;
  // each slide slides in from the side it comes from, then its blocks rise one after another
  const draw = () => {
    sh.innerHTML = `<div class="cnt">${i + 1} / ${deck.slides.length}</div><button class="x" aria-label="close">✕</button>`;
    const b = slideBox(deck, i, st, dir > 0 ? 'in-r' : 'in-l'); sh.prepend(b);
    b.querySelectorAll('.card, .ag-row, .sum-row, .tl-pt, .cv, .kp, .take, .chips, figure, .pts li').forEach((el, k) => { el.classList.add('rise'); el.style.animationDelay = (180 + k * 70) + 'ms'; });
    sh.querySelector('.x').onclick = e => { e.stopPropagation(); close(); };
  };
  const step = d => { const j = Math.max(0, Math.min(deck.slides.length - 1, i + d)); if (j === i) return; dir = d; i = j; draw(); };
  const key = e => { if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) step(1); else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) step(-1); else if (e.key === 'Escape') close(); };
  const close = () => { document.removeEventListener('keydown', key, true); sh.remove(); };
  document.addEventListener('keydown', key, true);
  sh.addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
  sh.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); else step(1); });
  sh.onclick = e => { if (!('ontouchstart' in window)) step(e.clientX > innerWidth / 3 ? 1 : -1); };
  draw();
}

// ---------- export: slides drawn to pictures in the page itself, then PPTX (editable text) or PDF ----------
const libs = {};
function loadLib(name, src) { return libs[name] ??= new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => { delete libs[name]; bad(new Error('library')); }; document.head.append(s); }); }
const toDataURL = blob => new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(blob); });
async function fontCSS(st) { // the deck's two families as data URLs, so the pictures carry the real fonts
  const fams = [st.fonts.h, st.fonts.b].map(f => f.replace(/ /g, '_'));
  const rules = FONT_FACES.filter(r => fams.some(f => r.file.startsWith(f + '-')));
  const parts = await Promise.all(rules.map(async r => { try { const b = await (await fetch('fonts/' + r.file)).blob(); return r.css.replace('fonts/' + r.file, await toDataURL(b)); } catch { return ''; } }));
  return parts.join('\n');
}
async function inlineImages(root) {
  // photos go in as small JPEGs: a slide picture is one data URL, and browsers refuse very long ones
  for (const im of root.querySelectorAll('img')) {
    try {
      const bmp = await createImageBitmap(await (await fetch(im.src)).blob()), k = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      im.src = c.toDataURL('image/jpeg', 0.82);
      await im.decode().catch(() => { });
    } catch { im.remove(); }
  }
}
async function slideToCanvas(slideEl, css, mode) {
  // XMLSerializer, not outerHTML: the picture is parsed as XML, where <img> must be self-closed
  const html = new XMLSerializer().serializeToString(slideEl).replace('class="slide ', `class="slide ${mode ? 'cap-' + mode + ' ' : ''}`);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><foreignObject width="1920" height="1080"><div xmlns="http://www.w3.org/1999/xhtml"><style><![CDATA[${css.replace(/]]>/g, "")}]]></style>${html}</div></foreignObject></svg>`;
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const c = document.createElement('canvas'); c.width = 1920; c.height = 1080;
  c.getContext('2d').drawImage(img, 0, 0);
  try { c.toDataURL('image/jpeg', 0.1); return c; } catch { return null; } // some browsers (Safari) refuse to export such a picture
}

  document.body.append(stage);
  try {
    await loadLib(fmt, fmt === 'pptx' ? 'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js' : 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');

    else out = new jspdf.jsPDF({ orientation: 'landscape', unit: 'px', format: [1920, 1080], hotfixes: ['px_scaling'] });

          fontFace: t.font, fontSize: Math.max(6, +(t.size * 0.5).toFixed(1)), bold: t.bold, italic: t.italic, color: t.color, lineSpacingMultiple: t.lh, charSpacing: t.ls ? +(t.ls * 0.5).toFixed(2) : undefined, fit: 'shrink', wrap: true });
